<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="커피로그">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>커피로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script defer src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=53197b8a3f18075ca99a32c87ef13c91&libraries=services&autoload=false"></script>
<script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FFFDF9;--ink:#2A2522;--sub:#8A817A;--acc:#6F4E37;--onacc:#fff;--soft:#F3EBE3;--softt:#6F4E37;
  --note:#F7F2EC;--heart:#FCEFEF;--heartt:#B4475A;--line:#EDE5DC;--frame:#fff;--ph:#E7D3BE;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',-apple-system,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{outline:none}
.hidden{display:none!important}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}

/* ---------- 탭 공통 ---------- */
.view{position:fixed;inset:0;bottom:calc(64px + var(--safe-b));overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;height:100%}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:30}
.headbtns{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.headbtns::-webkit-scrollbar{display:none}
.pin.friend .ring{border-color:#5B8DEF}
.pin.friend .tip{border-top-color:#5B8DEF}
.pin .fwho{margin-top:2px;font-size:10px;color:#fff;background:#5B8DEF;padding:1px 7px;border-radius:999px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frme{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--note);border-radius:14px;padding:14px 16px;margin-top:4px}
.frme.col{flex-direction:column;align-items:stretch}
.frme .inp{background:var(--bg);border-color:var(--line)}
.frme b{font-size:18px}
.frline{display:flex;gap:8px;align-items:center}
.frline .inp{flex:1;min-width:0}
.frline .btn{flex:none;padding:12px 16px}
.frrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.frrow .av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--softt);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.frrow .nm{flex:1;min-width:0;font-size:15px}
.frrow .btn{padding:8px 12px;font-size:13px;flex:none}
.frrow .go{color:var(--sub);font-size:20px}
.frrev{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.fcafe{border-bottom:1px solid var(--line)}
.fcafe .item{border:0}
.headbtns .chip{background:var(--soft);color:var(--softt);border-color:transparent}
.album h4{margin:22px 0 10px;font-size:15px;font-weight:700}
.album h4 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.albumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.albumgrid .pol{position:relative;padding:5px 5px 18px}
.albumgrid .pol>div:first-of-type{width:100%;height:auto;aspect-ratio:1/1.05}
.albumgrid .pol .cap{font-size:10px;bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pernav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.pernav .lbl{font-size:18px;font-weight:700}
.pernav .iconbtn{background:var(--note)}
.bars .row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bars .row .n{width:38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .row .b{flex:1;height:10px;border-radius:5px;background:var(--note);overflow:hidden}
.bars .row .b i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bars .row .v{width:44px;text-align:right;color:var(--sub);font-size:12px}
.mres{display:block;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.mres .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.mres .s{font-size:12px;color:var(--sub);margin-top:3px}
.mres .r{font-size:13px;margin-top:5px;line-height:1.5;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roundbtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.conqinfo{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.10);font-size:13px;max-width:100%}
.conqinfo b{font-weight:700;color:var(--acc)}
.conqinfo span{color:var(--sub)}
.conqinfo small{flex-basis:100%;font-size:10px;color:var(--sub);opacity:.8}
.nexttry{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--softt);font-size:14px}
.nexttry .lb{flex:none;font-weight:700}
.nexttry .v{flex:1;min-width:0;color:var(--ink)}
.nexttry .inp{margin:0;padding:8px 10px}
.aibtns{display:flex;gap:8px;margin:4px 0 8px}
.aibtns .btn{flex:1;padding:13px 8px;font-size:14px}
.nextbar{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--soft);color:var(--softt);font-size:13px}
.stampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px}
.stamp{display:flex;flex-direction:column;align-items:center;text-align:center}
.stamp .disc{width:74px;height:74px;border-radius:50%;border:2.5px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--note);filter:grayscale(1);opacity:.45}
.stamp .disc .cup{width:44px;height:44px}
.stamp.on .disc{border-color:var(--acc);background:var(--soft);filter:none;opacity:1;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--acc)}
.stamp .nm{font-size:13px;margin-top:10px;font-weight:700}
.stamp .ds{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.35}
.stamp .pg{width:60px;height:5px;border-radius:3px;background:var(--note);margin-top:6px;overflow:hidden}
.stamp .pg i{display:block;height:100%;background:var(--acc)}
.pickres{background:var(--note);border-radius:18px;padding:16px;margin-top:18px;text-align:center}
.pickres.pop{animation:pickpop .38s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pickpop{from{transform:scale(.88) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.dicebox{background:var(--note);border-radius:18px;margin-top:18px;padding:30px 16px 22px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.die{width:68px;height:68px;border-radius:17px;background:var(--bg);border:2px solid var(--acc);box-shadow:0 5px 0 var(--soft),0 10px 18px rgba(0,0,0,.10);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:4px;animation:dieroll 1.15s cubic-bezier(.25,.8,.35,1) both}
.die i{border-radius:50%}
.die i.on{background:var(--acc)}
@keyframes dieroll{0%{transform:translate(-150px,-70px) rotate(-540deg)}35%{transform:translate(-40px,0) rotate(-200deg)}50%{transform:translate(-10px,-30px) rotate(-80deg)}65%{transform:translate(8px,0) rotate(-10deg)}78%{transform:translate(4px,-9px) rotate(8deg)}90%{transform:translate(0,0) rotate(-3deg)}100%{transform:none}}
.flick{margin-top:18px;font-size:16px;min-height:22px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickres .pols{margin:0 auto 4px;width:300px;max-width:100%}
.ckrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.ckrow .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--onacc);font-size:14px}
.ckrow.on .ck{background:var(--acc);border-color:var(--acc)}
.ckrow .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckrow .ad{font-size:12px;color:var(--sub)}
.linkbox{background:var(--note);border-radius:12px;padding:12px 14px;font-size:14px;word-break:break-all;margin-top:10px}
.shrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.shrow .info{flex:1;min-width:0}
.shrow .info b{display:block;font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shrow .info span{font-size:12px;color:var(--sub)}
.shrow button{font-size:13px;color:var(--softt);background:var(--soft);padding:7px 11px;border-radius:999px}
.sharetop{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.10);border:1px solid var(--line)}
.sharetop .tt{flex:1;min-width:0}
.sharetop .tt b{display:block;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sharetop .tt span{font-size:12px;color:var(--sub)}
.sharetop button{font-size:13px;background:var(--acc);color:var(--onacc);padding:8px 12px;border-radius:999px;flex:none}
body.sharemode #tabbar,body.sharemode #btnAdd,body.sharemode #btnPick,body.sharemode #btnSnap,body.sharemode #btnConq,body.sharemode #btnFriends,body.sharemode .searchbar,body.sharemode #mapChips{display:none!important}
body.sharemode .view{bottom:0}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--sub)}
#tabbar button.on{color:var(--acc)}
#tabbar svg{width:24px;height:24px}

/* ---------- 지도 ---------- */
#map{position:absolute;inset:0}
#mapTop{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 14px 0;z-index:9;pointer-events:none}
#results:not(.hidden)~#mapTop .chips{display:none}
#mapTop>*{pointer-events:auto}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:0 14px;height:50px;box-shadow:0 2px 10px rgba(0,0,0,.10);border:1px solid var(--line)}
.searchbar input{flex:1;border:0;background:none;font-size:16px;min-width:0}
.searchbar input::placeholder{color:var(--sub)}
.searchbar svg{width:20px;height:20px;color:var(--sub);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.mapbtns{position:absolute;right:14px;z-index:5;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
.roundbtn{width:46px;height:46px;border-radius:50%;background:var(--bg);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.roundbtn svg{width:22px;height:22px}
.roundbtn.add{background:var(--acc);color:var(--onacc);border-color:var(--acc);width:54px;height:54px}

/* 내 카페 핀 */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer;transform-origin:bottom center;transition:transform .15s}
.pin.sel{transform:scale(1.15);z-index:3}
.pin .ring{width:48px;height:48px;border-radius:50%;background:var(--frame);border:3px solid var(--acc);padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin .ring>div{width:100%;height:100%;border-radius:50%;background:var(--ph) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:18px}
.cup{display:block;flex:none}
.pin .ring .cup{width:30px;height:30px}
.thumbpol .cup{width:44px;height:44px}
.pickres .cup{width:64px;height:64px;margin:4px auto 8px}
.pin .tip{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--acc);margin-top:-1px}
.pin .nm{margin-top:3px;font-size:12px;background:var(--bg);color:var(--ink);padding:2px 8px;border-radius:999px;border:1px solid var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* ♥ 또 갈래 핀: 하트 배지 + 은은한 빛 + 가끔 두근 */
.pin .ring{position:relative}
.pin.fav .ring{border-color:var(--heartt);box-shadow:0 0 0 4px color-mix(in srgb,var(--heartt) 22%,transparent),0 3px 10px color-mix(in srgb,var(--heartt) 45%,transparent)}
.pin.fav .ring::after{content:'♥';position:absolute;top:-7px;right:-8px;width:21px;height:21px;border-radius:50%;background:var(--heartt);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--frame);box-shadow:0 1px 4px rgba(0,0,0,.25);animation:favbeat 2.6s ease-in-out infinite}
.pin.fav .tip{border-top-color:var(--heartt)}
.pin.fav .nm{border-color:var(--heartt);color:var(--heartt);font-weight:700}
@keyframes favbeat{0%,68%,100%{transform:scale(1)}76%{transform:scale(1.28)}84%{transform:scale(.94)}92%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.pin.fav .ring::after{animation:none}}
.pin.wish .ring{border-style:dashed;border-color:var(--sub);background:var(--bg)}
.pin.wish .ring>div{background:var(--soft);color:var(--softt);font-size:20px}
.pin.wish .tip{border-top-color:var(--sub)}
.pin.wish .nm{border-style:dashed}
.tempPin{display:flex;flex-direction:column;align-items:center}
.tempPin .dot{width:22px;height:22px;border-radius:50%;background:var(--acc);border:4px solid var(--frame);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent)}
.mePin{width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.2)}

/* 바텀시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:8px 18px 18px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:max(240px, calc(100% - 250px - var(--safe-t, 0px)));overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}

/* 폴라로이드 */
.pols{position:relative;height:178px;margin:2px 0 6px}
.pol{position:absolute;background:var(--frame);padding:7px 7px 22px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.16);border:1px solid var(--line)}
.pol>div:first-of-type{width:104px;height:118px;background:var(--ph) center/cover no-repeat}
.pol .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:var(--sub)}
.pols.empty{height:auto}
.emptyPhoto{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--sub);font-size:14px}

.title{font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.subt{font-size:13px;color:var(--sub);margin-top:3px}
.rowsb{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{display:inline-block;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--softt);margin:0 4px 4px 0}
.tag.heart{background:var(--heart);color:var(--heartt)}
.tag.wish{background:transparent;color:var(--sub);border:1px dashed var(--sub)}
.btn.wishbtn{background:var(--bg);color:var(--ink);border:1.5px dashed var(--sub)}
.score{flex:none;background:var(--soft);color:var(--softt);font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.note{background:var(--note);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note .meta{font-size:12px;color:var(--sub);margin-bottom:4px;white-space:normal}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{text-decoration:none;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;padding:13px 10px;border-radius:14px;background:var(--acc);color:var(--onacc);text-align:center}
.btn.ghost{background:var(--soft);color:var(--softt)}
.btn.kakao{background:#FEE500;color:#191600}
.btn.naver{background:#03C75A;color:#fff}
.btn.danger{background:var(--heart);color:var(--heartt)}
.btn svg{width:18px;height:18px}
.linkrow{display:flex;gap:8px;margin-top:8px}
.linkrow .btn{padding:11px 8px;font-size:13px}

/* 검색 결과 */
#results{position:absolute;inset:0;z-index:7;background:var(--bg);padding-top:calc(74px + var(--safe-t));overflow-y:auto}
.res{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.res .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--softt);display:flex;align-items:center;justify-content:center;flex:none}
.res .ic svg{width:18px;height:18px}
.res .nm{font-size:16px}
.res .ad{font-size:13px;color:var(--sub);margin-top:2px}
.res .cat{font-size:12px;color:var(--sub);margin-top:2px}
.res .mine{font-size:11px;background:var(--acc);color:var(--onacc);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.res .dist{margin-left:auto;font-size:12px;color:var(--sub);flex:none;padding-top:3px}
.hint{padding:28px 18px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.textbtn{color:var(--acc);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* 목록 */
.pagehead{padding:calc(18px + var(--safe-t)) 18px 6px}
.pagehead h1{margin:0;font-size:24px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--sub);font-size:13px}
.listtools{padding:6px 18px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.listsearch{display:flex;align-items:center;gap:8px;background:var(--note);border-radius:12px;padding:0 12px;height:42px}
.listsearch input{flex:1;border:0;background:none;font-size:15px}
.listsearch svg{width:18px;height:18px;color:var(--sub)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.item{display:flex;gap:14px;padding:14px 18px;align-items:center;border-bottom:1px solid var(--line)}
.thumbpol{flex:none;background:var(--frame);padding:4px 4px 12px;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,.15);border:1px solid var(--line)}
.thumbpol>div{width:62px;height:62px;background:var(--ph) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
.item .info{flex:1;min-width:0}
.item .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ad{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mini{font-size:12px;color:var(--sub);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .mini b{color:var(--softt);font-weight:400;background:var(--soft);padding:2px 7px;border-radius:999px}
.empty{padding:60px 30px;text-align:center;color:var(--sub);line-height:1.8}
.empty .big{font-size:40px;margin-bottom:6px}

/* 풀스크린 페이지 (상세/편집) */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.page.open{transform:none}
.page .bar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 10px 10px;border-bottom:1px solid var(--line);flex:none}
.page .bar .t{flex:1;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink);flex:none}
.iconbtn svg{width:24px;height:24px}
.page .body{flex:1;overflow-y:auto;padding:16px 18px calc(30px + var(--safe-b))}
.sec{margin-top:24px}
.sec h3{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 small{font-size:13px;color:var(--sub);font-weight:400}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px;padding:6px 2px}
.wall .pol{position:relative}
.wall .pol>div:first-of-type{width:100%;height:auto;aspect-ratio:1/1.1}

.visit{position:relative;padding-left:20px;margin-bottom:18px}
.visit:before{content:"";position:absolute;left:5px;top:8px;bottom:-18px;width:2px;background:var(--line)}
.visit:last-child:before{display:none}
.visit:after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.visit .vh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:6px}
.visit .stars{color:#F2A93B;letter-spacing:1px}
.vphotos{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.vphotos::-webkit-scrollbar{display:none}
.vphotos .pol{position:relative;flex:none}
.vphotos .pol>div:first-of-type{width:84px;height:92px}
.small{font-size:12px;color:var(--sub)}
.vacts{display:flex;gap:14px;margin-top:6px}
.vacts button{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}

/* 폼 */
label.f{display:block;font-size:13px;color:var(--sub);margin:18px 0 7px}
.inp{width:100%;background:var(--note);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px}
.inp:focus{border-color:var(--acc);background:var(--bg)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}
.starpick{display:flex;gap:6px}
.starpick button{font-size:34px;line-height:1;color:var(--line)}
.starpick button.on{color:#F2A93B}
.myrate{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:var(--note);border-radius:14px}
.myrate .lb{font-size:14px;flex:none}
.myrate .starpick button{font-size:28px}
.myrate .avg{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;line-height:1.4}
.score small{display:block;font-size:10px;font-weight:400;opacity:.75;text-align:center}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick .chip{background:var(--note);border-color:transparent}
.tagpick .chip.on{background:var(--acc);color:var(--onacc)}
.addph{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px}
.addph .pol{position:relative}
.addph .pol>div:first-of-type{width:86px;height:94px}
.addph .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px;display:flex;align-items:center;justify-content:center}
.addph .plus{width:102px;height:126px;border:1.5px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:13px}
.addph .plus svg{width:26px;height:26px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--note);border-radius:12px;padding:12px 14px;margin-top:18px}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--heartt)}
.sw.on:after{left:23px}
.savebar{flex:none;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}

/* 설정 */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{border-radius:16px;padding:12px;border:2px solid transparent;text-align:left}
.theme.on{border-color:var(--ink)}
.theme .sw3{display:flex;gap:4px;margin-bottom:8px}
.theme .sw3 span{width:20px;height:20px;border-radius:50%}
.theme .tn{font-size:14px}
.setrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.setrow svg{width:22px;height:22px;color:var(--acc);flex:none}
.setrow small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.acct{background:var(--note);border-radius:16px;padding:16px}
.acct .who{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;border-radius:50%;background:var(--soft) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--softt);font-size:20px}
.acct .st{font-size:12px;color:var(--sub);margin-top:3px}
.btn.kakaologin{background:#FEE500;color:#191600}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3BB273;margin-right:5px;vertical-align:1px}
.syncdot.off{background:var(--sub)}
.syncdot.err{background:#D9534F}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--note);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700;color:var(--acc)}
.stat span{font-size:12px;color:var(--sub)}

/* 사진 크게 보기 */
#viewer{position:fixed;inset:0;z-index:60;background:rgba(20,16,14,.94);display:flex;align-items:center;justify-content:center;flex-direction:column}
#viewer .vpol{background:#fff;padding:12px 12px 46px;border-radius:4px;max-width:92vw;position:relative;transform:rotate(-1deg)}
#viewer img{display:block;max-width:calc(92vw - 24px);max-height:70vh;object-fit:contain}
#viewer .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#555;font-size:15px}
#viewer .vnav{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
#viewer .close{position:absolute;top:calc(14px + var(--safe-t));right:14px;color:#fff;font-size:28px;width:44px;height:44px}
#viewer .cnt{color:#ddd;font-size:13px;margin-top:16px}
#viewer .vcover{margin-top:14px;background:rgba(255,255,255,.92);color:#2A2522;padding:10px 18px;border-radius:999px;font-size:14px}
#viewer .vcover.on{background:#F2A93B;color:#fff}
.covbadge{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#F2A93B;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:1}

/* 다이얼로그/토스트 */
#dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:30px}
#dlg .box{background:var(--bg);border-radius:20px;padding:22px 20px 16px;width:100%;max-width:340px}
#dlg .msg{font-size:16px;line-height:1.6;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#loading{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#loading div{background:var(--bg);padding:16px 22px;border-radius:16px;font-size:15px}
#maperr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--sub);line-height:1.8;z-index:1}
</style>
</head>
<body>

<!-- 지도 탭 -->
<section class="view" id="v-map">
  <div id="maperr" class="hidden"></div>
  <div id="map"></div>
  <div id="results" class="hidden"></div>
  <div id="mapTop">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="카페 이름이나 동네 검색" autocomplete="off">
      <button id="qClear" class="hidden" aria-label="검색 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="chips" id="mapChips"></div>
    <div class="conqinfo hidden" id="conqInfo"></div>
  </div>
  <div class="mapbtns" id="mapBtns" style="bottom:20px">
    <button class="roundbtn" id="btnConq" aria-label="동네 정복 지도"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg></button>
    <button class="roundbtn" id="btnSnap" aria-label="사진으로 기록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="roundbtn" id="btnPick" aria-label="오늘 어디 갈까"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></svg></button>
    <button class="roundbtn" id="btnFriends" aria-label="친구 카페 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.5 14.2c2.6-.3 4.6 1.3 5.1 4.3"/></svg></button>
    <button class="roundbtn" id="btnFit" aria-label="내 카페 전체 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
    <button class="roundbtn" id="btnMe" aria-label="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
    <button class="roundbtn add" id="btnAdd" aria-label="카페 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="sheet" id="sheet"></div>
</section>

<!-- 목록 탭 -->
<section class="view hidden" id="v-list">
  <div class="scroll" id="listScroll">
    <div class="pagehead"><h1>내 카페 기록</h1><p id="listCount"></p>
      <div class="headbtns"><button class="chip" id="lFriends">👥 친구</button><button class="chip" id="lSnap">📷 사진으로 기록</button><button class="chip" id="lPick">🎲 오늘 어디 갈까</button><button class="chip" id="lShare">🔗 공유 링크 만들기</button></div></div>
    <div class="listtools">
      <div class="listsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="lq" type="search" placeholder="이름, 동네, 메뉴, 후기로 찾기">
      </div>
      <div class="seg" id="sortSeg"></div>
      <div class="seg" id="listChips" style="padding-top:0"></div>
    </div>
    <div id="list"></div>
  </div>
</section>

<!-- 설정 탭 -->
<!-- 기록 탭 -->
<section class="view hidden" id="v-rec">
  <div class="scroll" id="recScroll">
    <div class="pagehead"><h1>모아보기</h1></div>
    <div class="listtools"><div class="seg" id="recSeg"></div></div>
    <div id="recBody" style="padding:0 18px 40px"></div>
  </div>
</section>

<section class="view hidden" id="v-fr">
  <div class="scroll" id="frScroll">
    <div class="pagehead"><h1>친구</h1></div>
    <div style="padding:0 18px 30px" id="frBody"></div>
  </div>
</section>

<section class="view hidden" id="v-set">
  <div class="scroll">
    <div class="pagehead"><h1>설정</h1></div>
    <div style="padding:0 18px 30px">
      <div class="sec" style="margin-top:12px"><h3>계정</h3><div class="acct" id="acct"></div></div>
      <div class="sec"><h3>내 기록</h3><div class="stats" id="stats"></div></div>
      <div class="sec"><h3>앱 업데이트</h3><button class="setrow" id="btnUpdate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><div>업데이트 확인<small id="verInfo"></small></div></button></div>
      <div class="sec"><h3>색 테마</h3><div class="themes" id="themes"></div></div>
      <div class="sec"><h3>내 공유 링크</h3><div id="shareList"></div></div>
      <div class="sec"><h3>AI한테 카페 추천받기</h3>
        <div class="aibtns"><button class="btn" id="btnAiGpt">ChatGPT로 추천받기</button><button class="btn ghost" id="btnAiClaude">Claude로 추천받기</button></div>
        <p class="small" style="line-height:1.6;margin:0 0 6px">휴대폰에선 공유 창이 떠요. ChatGPT나 Claude 앱을 고르면 내 기록 파일이 첨부된 채로 열려요.</p>
        <button class="setrow" id="btnAiCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><div>내 기록 복사하기<small>Claude나 GPT 채팅창에 붙여넣으면 취향에 맞는 새 카페를 추천받을 수 있어요</small></div></button>
        <button class="setrow" id="btnAiFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><div>파일로 저장 (.md)<small>같은 내용을 파일로 받아서 첨부할 때</small></div></button>
        <button class="setrow" id="btnAiCsv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg><div>표 파일로 저장 (.csv)<small>방문 기록 전체, 엑셀이나 구글 시트로도 열려요</small></div></button>
      </div>
      <div class="sec"><h3>백업</h3>
        <button class="setrow" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><div>백업 파일 저장<small>사진까지 전부 한 파일로 내려받아요</small></div></button>
        <button class="setrow" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg><div>백업 파일 불러오기<small>다른 폰이나 브라우저로 옮길 때</small></div></button>
        <input type="file" id="importFile" accept="application/json,.json" class="hidden">
        <p class="small" style="line-height:1.7;margin-top:12px">카카오로 로그인하면 기록과 사진이 서버에 같이 저장돼서 다른 폰이나 PC에서도 보여요. 로그인하지 않으면 이 기기 브라우저 안에만 저장되니 백업 파일을 꼭 저장해 두세요.</p>
        <p class="small" id="storageInfo"></p>
      </div>
    </div>
  </div>
</section>

<nav id="tabbar">
  <button data-tab="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>지도</button>
  <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>목록</button>
  <button data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 5V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3"/><path d="M3 15l4-4 4 4 2-2 4 4"/></svg>모아보기</button>
  <button data-tab="fr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.5 14.2c2.6-.3 4.6 1.3 5.1 4.3"/></svg>친구</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>

<!-- 사진으로 기록 -->
<div class="page" id="pSnap">
  <div class="bar">
    <button class="iconbtn" data-close="pSnap" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t">사진으로 기록</div><div style="width:40px"></div>

const cupDay = () => Math.floor((Date.now() + 9 * 3600e3) / 86400e3);
function cupIcon(id){
  let h = (cupDay() * 2654435761) >>> 0;
  for (const ch of String(id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
  return `<svg class="cup" viewBox="0 0 32 32" aria-hidden="true">${CUP_ARTS[(h >>> 0) % CUP_ARTS.length]}</svg>`;
}
function hashRot(id, i){ let h = 0; for (const c of (id+i)) h = (h*31 + c.charCodeAt(0)) | 0; return ((Math.abs(h) % 9) - 4) * 0.9; }
function distKm(a, b){ const R=6371, t=x=>x*Math.PI/180; const dLa=t(b.lat-a.lat), dLo=t(b.lng-a.lng); const s=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const fmtDist = km => km == null ? '' : km < 1 ? Math.round(km*1000)+'m' : km.toFixed(km<10?1:0)+'km';

function ask(msg, okText='확인', danger=false){

  });
}

/* =========================================================
   저장소 (IndexedDB) — 카페, 방문기록, 사진
   ========================================================= */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('cafe-map', 2);
    r.onupgradeneeded = (e) => { const d = r.result;
      if (e.oldVersion < 1) {
        d.createObjectStore('cafes', {keyPath:'id'});
        const v = d.createObjectStore('visits', {keyPath:'id'}); v.createIndex('cafeId','cafeId');
        d.createObjectStore('photos', {keyPath:'id'});
      }
      if (e.oldVersion < 2) d.createObjectStore('tomb', {keyPath:'id'}); // 지운 기록 (서버에 알려줄 목록)
    };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });},
  tx(store, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error);
  });},
  all(store){ return this.tx(store, 'readonly', s => s.getAll()); },
  keys(store){ return this.tx(store, 'readonly', s => s.getAllKeys()); },
  get(store, id){ return this.tx(store, 'readonly', s => s.get(id)); },
  put(store, obj){ return this.tx(store, 'readwrite', s => s.put(obj)); },
  del(store, id){ return this.tx(store, 'readwrite', s => s.delete(id)); },
  clear(store){ return this.tx(store, 'readwrite', s => s.clear()); },
};
async function tomb(kind, id, extra){ try { await DB.put('tomb', { id: kind + ':' + id, kind, rid: id, ...(extra||{}) }); } catch {} }

let cafes = [], visits = [];
const photoURL = new Map(); // photoId -> {full, thumb}

async function loadAll(){
  cafes = await DB.all('cafes'); visits = await DB.all('visits');
}
async function getPhotoURL(id, kind='thumb'){
  if (!id) return '';
  let rec = photoURL.get(id);
  if (rec && rec[kind]) return rec[kind];
  let p = await DB.get('photos', id);
  if (!p || !(p[kind] || (kind === 'thumb' && p.full))) p = await fetchRemotePhoto(id, kind, p);
  if (!p) return '';
  rec = photoURL.get(id) || {};
  if (p.full && !rec.full) rec.full = URL.createObjectURL(p.full);
  if (p.thumb && !rec.thumb) rec.thumb = URL.createObjectURL(p.thumb);
  if (!rec.thumb && rec.full) rec.thumb = rec.full;
  photoURL.set(id, rec);
  return rec[kind] || rec.thumb || rec.full || '';
}
// 이 기기에 없는 사진은 서버에서 받아와 저장 (다른 기기에서 찍은 사진)
const photoFetching = new Map();
function fetchRemotePhoto(id, kind, existing){
  if (!sb || !session) return Promise.resolve(existing);
  const key = id + ':' + kind;
  if (photoFetching.has(key)) return photoFetching.get(key);
  const job = (async () => {
    try {
      const path = `${session.user.id}/${id}${kind === 'thumb' ? '_t' : ''}.jpg`;
      const { data, error } = await sb.storage.from('photos').download(path);
      if (error || !data) return existing;
      const cur = (await DB.get('photos', id)) || { id };
      cur[kind] = data; cur.uploaded = true;
      await DB.put('photos', cur);
      return cur;
    } catch { return existing; }
    finally { photoFetching.delete(key); }
  })();
  photoFetching.set(key, job);
  return job;
}
const once = fn => { let busy = false; return async (...a) => { if (busy) return; busy = true; try { return await fn(...a); } finally { busy = false; } }; };
const visitsOf = cid => visits.filter(v => v.cafeId === cid).sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.createdAt - a.createdAt);
function cafeStats(c){
  const vs = visitsOf(c.id); const rs = vs.filter(v => v.rating);
  const visitAvg = rs.length ? rs.reduce((s,v)=>s+v.rating,0)/rs.length : 0, my = +c.myRating || 0;
  return { count: vs.length, rating: my || visitAvg, my, visitAvg, rated: rs.length, last: vs[0]?.date || '', lastVisit: vs[0], photos: vs.flatMap(v => v.photoIds||[]) };
}

/* 사진 줄이기: 원본 최대 1600px, 썸네일 360px */
async function decodeImage(file){
  try { return await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch { const u = URL.createObjectURL(file); try { return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); } finally { setTimeout(() => URL.revokeObjectURL(u), 0); } }
}
function toJpeg(src, max, q){
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res({ blob: b, canvas: c }), 'image/jpeg', q));
}
async function savePhoto(file){
  const id = uid();
  const bmp = await decodeImage(file);
  const f = await toJpeg(bmp, 1600, .84); bmp.close?.();
  const t = await toJpeg(f.canvas, 360, .8);
  const full = f.blob, thumb = t.blob;
  await DB.put('photos', {id, full, thumb, uploaded: false});
  return id;
}

function applyTheme(k){
  const t = THEMES.find(x => x.k === k) || THEMES[0];
  const r = document.documentElement.style;
  for (const key of ['bg','ink','sub','acc','onacc','soft','softt','note','heart','heartt','line','frame','ph']) r.setProperty('--'+key, t[key]);
  document.querySelector('meta[name=theme-color]').content = t.bg;
  try { localStorage.setItem('theme', t.k); } catch {}
  renderThemes();
}

function initMap(){
  return new Promise(res => {
    if (!window.kakao || !kakao.maps) { mapFail(); return res(); }
    kakao.maps.load(() => {
      let center = new kakao.maps.LatLng(35.8714, 128.6014); // 대구 동성로 근처
      try { const s = JSON.parse(localStorage.getItem('mapView')); if (s) center = new kakao.maps.LatLng(s.lat, s.lng); } catch {}
      let level = 5; try { level = JSON.parse(localStorage.getItem('mapView'))?.level || 5; } catch {}
      map = new kakao.maps.Map($('#map'), { center, level });
      places = new kakao.maps.services.Places();
      kakao.maps.event.addListener(map, 'click', e => onMapTap(e.latLng));
      kakao.maps.event.addListener(map, 'idle', () => {
        const c = map.getCenter();
        try { localStorage.setItem('mapView', JSON.stringify({lat:c.getLat(), lng:c.getLng(), level:map.getLevel()})); } catch {}
        updateLabels();
      });
      res();
    });
  });
}
function mapFail(){
  $('#maperr').classList.remove('hidden');
  $('#maperr').innerHTML = '지도를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침 해주세요.<br><span class="small">목록 탭에서 기록은 그대로 볼 수 있어요.</span>';
}
function updateLabels(){
  if (!map) return;
  const show = map.getLevel() <= 6;
  document.querySelectorAll('.pin .nm').forEach(e => e.style.display = show ? '' : 'none');
}
function passFilter(c, f){
  if (f === '전체') return true;
  if (f === '♥ 또 갈래') return !!c.fav;
  if (f === '♪ 다녀왔어') return !c.wish;
  if (f === '☆ 가볼래') return !!c.wish;
  return (c.tags||[]).includes(f);
}
async function refreshPins(){
  if (!map) return;
  const day = cupDay(), seen = new Set();
  for (const c of cafes) {
    if (!passMap(c)) continue;
    seen.add(c.id);
    const sel = c.id === selectedId, sig = [c.name, c.lat, c.lng, c.wish ? 1 : 0, c.fav ? 1 : 0, day].join('|');
    let o = overlays.get(c.id);
    if (o && o._sig === sig) { if (o._el.classList.contains('sel') !== sel) { o._el.classList.toggle('sel', sel); o.setZIndex(sel ? 5 : 2); } continue; }
    if (o) o.setMap(null);
    const el = document.createElement('div');
    el.className = 'pin' + (c.wish ? ' wish' : c.fav ? ' fav' : '') + (sel ? ' sel' : '');
    el.innerHTML = `<div class="ring"><div>${cupIcon(c.id)}</div></div><div class="tip"></div><div class="nm">${esc(c.name)}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openSheet(c.id); });
    o = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(c.lat, c.lng), content: el, yAnchor: 1, clickable: true, zIndex: sel ? 5 : 2 });
    o.setMap(map); o._el = el; o._sig = sig;
    overlays.set(c.id, o);
  }
  for (const [k, o] of overlays) if (!seen.has(k)) { o.setMap(null); overlays.delete(k); }
  updateLabels();
  renderChips();
}
function fitAll(){
  const list = cafes.filter(passMap);
  if (!map || !list.length) { toast('아직 기록한 카페가 없어요'); return; }
  if (list.length === 1) { map.setLevel(4); map.panTo(new kakao.maps.LatLng(list[0].lat, list[0].lng)); return; }
  const b = new kakao.maps.LatLngBounds(); list.forEach(c => b.extend(new kakao.maps.LatLng(c.lat, c.lng)));
  map.setBounds(b, 80, 40, 120, 40);
}
function locate(pan=true){
  return new Promise(res => {
    if (!navigator.geolocation) { toast('이 브라우저는 위치를 지원하지 않아요'); return res(null); }
    navigator.geolocation.getCurrentPosition(p => {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (map) {
        const ll = new kakao.maps.LatLng(myPos.lat, myPos.lng);
        if (!meOverlay) { const d = document.createElement('div'); d.className = 'mePin'; meOverlay = new kakao.maps.CustomOverlay({ position: ll, content: d, zIndex: 1 }); }
        meOverlay.setPosition(ll); meOverlay.setMap(map);
        if (pan) { map.setLevel(Math.min(map.getLevel(), 4)); map.panTo(ll); }
      }
      res(myPos);
    }, () => { toast('위치 권한을 허용하면 내 위치를 볼 수 있어요'); res(null); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}

  const list = ['전체','♪ 다녀왔어','♥ 또 갈래','☆ 가볼래', ...TAGS.filter(t => used.has(t))];
  mapSel.tags.forEach(t => { if (!used.has(t)) mapSel.tags.delete(t); });
  const on = t => t === '전체' ? !mapSel.status && !mapSel.tags.size : t === mapSel.status || mapSel.tags.has(t);
  $('#mapChips').innerHTML = list.map(t => `<button class="chip ${on(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');

$('#mapChips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const t = b.dataset.t;
  if (t === '전체') { mapSel.status = ''; mapSel.tags.clear(); }
  else if (MAP_STATUS.includes(t)) mapSel.status = mapSel.status === t ? '' : t; // 셋 중 하나만, 다시 누르면 취소

};

function centerAbove(lat, lng){
  if (!map) return;
  map.setCenter(new kakao.maps.LatLng(lat, lng));
  const mr = $('#map').getBoundingClientRect(), vh = mr.height;
  const top = Math.max(0, ...[...$('#mapTop').children].filter(k => k.offsetParent).map(k => k.getBoundingClientRect().bottom - mr.top));
  const sh = $('#sheet'), h = sh.classList.contains('open') ? sh.offsetHeight : 0;
  const y = (top + vh - h) / 2 + 30;
  map.panBy(0, Math.round(vh / 2 - y));
}

/* 카드 끌어내리기: 손가락으로 아래로 끌면 따라 내려오고, 충분히 내리거나 휙 내리면 닫힘. 덜 내리면 제자리로 */
(function sheetDrag(){
  const sh = $('#sheet');
  let y0 = 0, x0 = 0, t0 = 0, dy = 0, mode = '', lastY = 0, lastT = 0, vel = 0, justDragged = false;
  const begin = (x, y) => { x0 = x; y0 = y; dy = 0; mode = 'wait'; t0 = lastT = performance.now(); lastY = y; vel = 0; };
  const move = (x, y, e) => {
    if (!mode) return;
    const ddx = x - x0, ddy = y - y0;
    if (mode === 'wait') {
      if (Math.abs(ddy) < 6 && Math.abs(ddx) < 6) return;
      // 아래로, 세로 방향, 카드 내용이 맨 위일 때만 끌기 (아니면 카드 안 스크롤)
      if (ddy > 0 && Math.abs(ddy) > Math.abs(ddx) && sh.scrollTop <= 0) { mode = 'drag'; sh.style.transition = 'none'; }
      else { mode = ''; return; }
    }
    if (e?.cancelable) e.preventDefault();
    dy = Math.max(0, ddy);
    const now = performance.now(); if (now > lastT) { vel = (y - lastY) / (now - lastT); lastY = y; lastT = now; }
    sh.style.transform = `translateY(${dy}px)`;
  };
  const end = () => {
    if (mode !== 'drag') { mode = ''; return; }
    mode = ''; justDragged = true; setTimeout(() => justDragged = false, 50);
    const h = sh.offsetHeight;
    if (performance.now() - lastT > 100) vel = 0; // 멈췄다가 놓으면 '휙'이 아님
    if (dy > Math.min(120, h * .3) || (vel > .55 && dy > 20)) {
      sh.style.transition = `transform ${Math.max(.12, Math.min(.26, (h - dy) / 1600))}s cubic-bezier(.3,.7,.4,1)`;
      sh.style.transform = 'translateY(110%)';
      const done = () => { sh.removeEventListener('transitionend', done); closeSheet(); requestAnimationFrame(() => { sh.style.transition = ''; sh.style.transform = ''; }); };
      sh.addEventListener('transitionend', done); setTimeout(() => sh.style.transform && done(), 400);
    } else {
      sh.style.transition = 'transform .32s cubic-bezier(.2,1.25,.4,1)'; // 살짝 튕기며 제자리로
      sh.style.transform = 'translateY(0)';
      setTimeout(() => { sh.style.transition = ''; sh.style.transform = ''; }, 340);
    }
  };
  sh.addEventListener('touchstart', e => { if (e.touches.length === 1) begin(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  sh.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
  // 마우스(PC)
  sh.addEventListener('mousedown', e => { if (e.button === 0) begin(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => mode && move(e.clientX, e.clientY, e));
  window.addEventListener('mouseup', end);
  // 끌고 난 직후 손을 뗄 때 버튼이 눌리지 않게
  sh.addEventListener('click', e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

// 지도에서 카페·식당 아이콘을 누르면, 누른 자리 바로 아래 장소를 찾아 카드로 보여줌
let tapSeq = 0, tapFound = [];
async function onMapTap(ll){
  if (SHARE_ID) { closeSheet(); return; }
  if ($('#sheet').classList.contains('open')) { closeSheet(); return; }
  if (!places || !$('#results').classList.contains('hidden')) return;
  const seq = ++tapSeq;
  // 지도 확대 정도에 따라 찾는 반경을 조절 (멀리 보면 넓게)
  const lv = map.getLevel(), radius = lv <= 2 ? 15 : lv <= 3 ? 25 : lv <= 4 ? 40 : 0;
  if (!radius) { toast('지도를 조금 더 확대한 뒤 눌러주세요'); return; }
  // 1) 누른 자리가 건물이면, 그 건물 주소에 있는 가게를 전부 찾아서 고르게 함
  const bld = await buildingPlaces(ll);
  if (seq !== tapSeq) return;
  if (bld && bld.list.length >= 2) { showBuilding(bld); return; }
  if (bld && bld.list.length === 1) { pickPlace(bld.list[0], true, bld.list); return; }
  // 2) 건물이 아니면(길, 공터) 누른 자리에서 제일 가까운 카페·음식점
  const opt = { x: ll.getLng(), y: ll.getLat(), radius, sort: kakao.maps.services.SortBy.DISTANCE };
  const found = [];
  for (const code of ['CE7', 'FD6']) {
    found.push(...await new Promise(res => places.categorySearch(code, (d, st) => res(st === kakao.maps.services.Status.OK ? d : []), opt)));
  }
  if (seq !== tapSeq) return;
  if (!found.length) return;
  found.sort((a, b) => (+a.distance) - (+b.distance));
  const seen = new Set(), uniq = found.filter(p => !seen.has(p.id) && seen.add(p.id));
  pickPlace(uniq[0], true, uniq);
}
// 누른 좌표의 건물 주소 → 그 주소로 등록된 가게 전부 (최대 45곳)
const geocoder = () => (window.__gc ||= new kakao.maps.services.Geocoder());
async function buildingPlaces(ll){
  try {
    const a = await new Promise(r => geocoder().coord2Address(ll.getLng(), ll.getLat(), (d, st) => r(st === kakao.maps.services.Status.OK ? d[0] : null)));
    const road = a?.road_address?.address_name; if (!road) return null;
    const tail = x => (x || '').split(' ').slice(1).join(' ').replace(/\s+/g, ' ').trim(); // '대구광역시'/'대구' 차이 무시
    const want = tail(road), list = [], seen = new Set();
    for (let page = 1; page <= 3; page++) {
      const [d, pg] = await new Promise(r => places.keywordSearch(road, (d, st, pg) => r([st === kakao.maps.services.Status.OK ? d : [], pg]), { x: ll.getLng(), y: ll.getLat(), radius: 300, page }));
      for (const p of d) if (tail(p.road_address_name) === want && !seen.has(p.id)) { seen.add(p.id); list.push(p); }
      if (!pg?.hasNextPage) break;
    }
    const rank = p => p.category_group_code === 'CE7' || /카페|커피|디저트|베이커리|제과/.test(p.category_name) ? 0 : p.category_group_code === 'FD6' ? 1 : 2;
    list.sort((x, y) => rank(x) - rank(y) || x.place_name.localeCompare(y.place_name, 'ko'));
    return { name: a.road_address.building_name || '', road: road.split(' ').slice(1).join(' '), list };
  } catch { return null; }
}

      const me = session.user.id;
      const strip = o => { const { dirty, ...r } = o; return r; };
      // 1) 아직 안 올린 사진 올리기
      for (const p of await DB.all('photos')) {
        if (p.uploaded || !p.full) continue;
        let r = await sb.storage.from('photos').upload(`${me}/${p.id}.jpg`, p.full, { upsert: true, contentType: 'image/jpeg' });
        if (r.error) throw r.error;
        if (p.thumb) { r = await sb.storage.from('photos').upload(`${me}/${p.id}_t.jpg`, p.thumb, { upsert: true, contentType: 'image/jpeg' }); if (r.error) throw r.error; }
        const cur = await DB.get('photos', p.id); if (cur) { cur.uploaded = true; await DB.put('photos', cur); }
      }
      // 2) 바뀐 카페, 방문 기록 올리기
      for (const [store, toRow] of [
        ['cafes',  c => ({ user_id: me, id: c.id, data: strip(c), deleted: false })],
        ['visits', v => ({ user_id: me, id: v.id, cafe_id: v.cafeId, data: strip(v), deleted: false })],
      ]) {
        const dirty = (await DB.all(store)).filter(x => x.dirty !== false);
        for (let i = 0; i < dirty.length; i += 200) {
          const chunk = dirty.slice(i, i + 200);
          const { error } = await sb.from(store).upsert(chunk.map(toRow));
          if (error) throw error;
          for (const x of chunk) { const cur = await DB.get(store, x.id); if (cur && (cur.updatedAt || 0) === (x.updatedAt || 0)) { cur.dirty = false; await DB.put(store, cur); } }
        }
      }
      // 3) 지운 것 알리기
      for (const t of await DB.all('tomb')) {
        if (t.kind === 'photo') { await sb.storage.from('photos').remove([`${me}/${t.rid}.jpg`, `${me}/${t.rid}_t.jpg`]); }
        else {
          const row = { user_id: me, id: t.rid, data: {}, deleted: true };
          if (t.kind === 'visit') row.cafe_id = t.cafeId || '';
          const { error } = await sb.from(t.kind === 'cafe' ? 'cafes' : 'visits').upsert(row);
          if (error) throw error;
        }
        await DB.del('tomb', t.id);
      }
      // 4) 다른 기기에서 바뀐 것 받아오기
      const key = 'lastPull:' + me;
      let since = '1970-01-01T00:00:00+00:00'; try { since = localStorage.getItem(key) || since; } catch {}
      let newest = since;
      for (const store of ['cafes', 'visits']) {
        let from = since;
        for (;;) {
          const { data, error } = await sb.from(store).select('id,data,deleted,updated_at').gt('updated_at', from).order('updated_at').limit(500);
          if (error) throw error;
          for (const row of data) {
            if (await applyRemote(store, row)) changed = true;
            if (row.updated_at > newest) newest = row.updated_at;
          }
          if (data.length < 500) break;
          from = data[data.length - 1].updated_at;
        }
      }
      try { localStorage.setItem(key, newest); } catch {}
      syncState.last = new Date().toISOString(); try { localStorage.setItem('lastSyncAt', syncState.last); } catch {}
    } catch (e) {
      syncState.error = navigator.onLine === false ? '인터넷 연결이 없어요' : '서버와 맞추지 못했어요';
      console.warn('sync', e);
    }
    syncState.running = false;
    if (changed) { await loadAll(); await refreshAll(); if (isOpen('pDetail') && detailId) openDetail(detailId, true); }
    renderAccount();
    if (syncState.again) { syncState.again = false; Sync.run(); }
  },
};
async function applyRemote(store, row){
  const local = await DB.get(store, row.id);
  if (row.deleted) {
    if (!local) return false;
    await DB.del(store, row.id);
    if (store === 'visits') for (const p of local.photoIds || []) { await DB.del('photos', p); photoURL.delete(p); }
    return true;
  }
  const remote = row.data || {};
  if (local && local.dirty !== false && (local.updatedAt || 0) > (remote.updatedAt || 0)) return false; // 이 기기 것이 더 최신
  if (local && local.dirty === false && (local.updatedAt || 0) === (remote.updatedAt || 0)) return false; // 내가 방금 올린 것과 같음 → 다시 그릴 필요 없음
  await DB.put(store, { ...remote, id: row.id, dirty: false });
  return true;
}

function renderStats(){
  const body = $('#recBody');
  const inPer = v => { if (!v.date) return false; const y = +v.date.slice(0,4), m = +v.date.slice(5,7); return statPer.year ? y === statPer.y : (y === statPer.y && m === statPer.m); };
  const vs = visits.filter(inPer);
  const label = statPer.year ? `${statPer.y}년` : `${statPer.y}년 ${statPer.m}월`;
  const nav = `<div class="pernav"><button class="iconbtn" data-nav="-1" aria-label="이전">‹</button><div class="lbl">${label}</div><button class="iconbtn" data-nav="1" aria-label="다음">›</button></div>
    <div class="seg" style="padding-top:0"><button class="chip ${!statPer.year?'on':''}" data-per="m">월별</button><button class="chip ${statPer.year?'on':''}" data-per="y">연도별</button></div>`;
  if (!vs.length) {
    body.innerHTML = nav + `<div class="empty" style="padding-top:30px">이 기간엔 방문 기록이 없어요.<br><span class="small">날짜를 넣은 방문 기록만 결산에 잡혀요.</span></div>`;
  } else {
    const spent = vs.reduce((s,v) => s + (+v.price||0), 0);
    const photos = vs.reduce((s,v) => s + (v.photoIds||[]).length, 0);
    const byCafe = new Map(); vs.forEach(v => byCafe.set(v.cafeId, (byCafe.get(v.cafeId)||0) + 1));
    const top = [...byCafe].sort((a,b) => b[1]-a[1]).slice(0,5);
    const rated = new Map(); vs.filter(v => v.rating).forEach(v => { const r = rated.get(v.cafeId) || [0,0]; r[0] += v.rating; r[1]++; rated.set(v.cafeId, r); });
    const best = [...rated].map(([id,[s,n]]) => [id, s/n]).sort((a,b) => b[1]-a[1]).slice(0,5);
    const byArea = new Map(); vs.forEach(v => { const a = areaOf(cafeById(v.cafeId)); byArea.set(a, (byArea.get(a)||0) + 1); });
    const areas = [...byArea].sort((a,b) => b[1]-a[1]).slice(0,8);
    const firstVisit = new Map(); [...visits].filter(v => v.date).sort((a,b) => a.date.localeCompare(b.date)).forEach(v => { if (!firstVisit.has(v.cafeId)) firstVisit.set(v.cafeId, v); });
    const newOnes = [...firstVisit.values()].filter(inPer).length;
    const bars = (rows, fmt) => { const mx = Math.max(...rows.map(r => r[1])); return `<div class="bars">${rows.map(([n,v]) => `<div class="row"><div class="n">${esc(n)}</div><div class="b"><i style="width:${Math.max(6, v/mx*100)}%"></i></div><div class="v">${fmt(v)}</div></div>`).join('')}</div>`; };
    body.innerHTML = nav + `
      <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-top:6px">
        <div class="stat"><b>${vs.length}</b><span>방문 기록</span></div>
        <div class="stat"><b>${byCafe.size}</b><span>간 카페 (새로 ${newOnes}곳)</span></div>
        <div class="stat"><b>${spent ? spent.toLocaleString('ko-KR') : '-'}</b><span>쓴 돈 (원)</span></div>
        <div class="stat"><b>${photos}</b><span>찍은 사진</span></div>
      </div>
      <div class="sec"><h3>제일 많이 간 곳</h3>${bars(top.map(([id,n]) => [cafeById(id)?.name || '?', n]), v => v + '번')}</div>
      ${best.length ? `<div class="sec"><h3>별점 TOP ${best.length}</h3>${bars(best.map(([id,r]) => [cafeById(id)?.name || '?', r]), v => '★ ' + v.toFixed(1))}</div>` : ''}
      <div class="sec"><h3>동네별</h3>${bars(areas, v => v + '번')}</div>`;
  }
  body.onclick = e => {
    const n = e.target.closest('[data-nav]');
    if (n) { const d = +n.dataset.nav; if (statPer.year) statPer.y += d; else { statPer.m += d; if (statPer.m < 1) { statPer.m = 12; statPer.y--; } if (statPer.m > 12) { statPer.m = 1; statPer.y++; } } renderStats(); return; }
    const pr = e.target.closest('[data-per]'); if (pr) { statPer.year = pr.dataset.per === 'y'; renderStats(); }
  };
}

/* =========================================================
   사진으로 바로 기록 (사진 속 위치·날짜 읽기)
   ========================================================= */
async function readExif(file){
  try {
    const buf = await file.slice(0, 256 * 1024).arrayBuffer();
    const dv = new DataView(buf);
    if (dv.getUint16(0) !== 0xFFD8) return {};
    let off = 2;
    while (off + 4 < dv.byteLength) {
      const mk = dv.getUint16(off), len = dv.getUint16(off + 2);
      if (mk === 0xFFE1 && dv.getUint32(off + 4) === 0x45786966) {
        const t = off + 10, le = dv.getUint16(t) === 0x4949;
        const u16 = o => dv.getUint16(t + o, le), u32 = o => dv.getUint32(t + o, le);
        const ifd = o => { const n = u16(o), m = {}; for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; m[u16(e)] = { type: u16(e + 2), cnt: u32(e + 4), at: e + 8 }; } return m; };
        const val = en => (en.type === 3 ? u16(en.at) : u32(en.at));
        const str = en => { const p = en.cnt > 4 ? u32(en.at) : en.at; let s = ''; for (let i = 0; i < en.cnt - 1; i++) s += String.fromCharCode(dv.getUint8(t + p + i)); return s; };
        const rat3 = en => { const p = u32(en.at), r = k => u32(p + k * 8) / (u32(p + k * 8 + 4) || 1); return r(0) + r(1) / 60 + r(2) / 3600; };
        const out = {};
        const i0 = ifd(u32(4));
        if (i0[0x8769]) { const ex = ifd(val(i0[0x8769])); const d = ex[0x9003] || ex[0x9004]; if (d) out.date = str(d).slice(0, 10).replace(/:/g, '-'); }
        if (!out.date && i0[0x0132]) out.date = str(i0[0x0132]).slice(0, 10).replace(/:/g, '-');
        if (i0[0x8825]) {
          const g = ifd(val(i0[0x8825]));
          if (g[2] && g[4]) {
            let lat = rat3(g[2]), lng = rat3(g[4]);
            if (g[1] && String.fromCharCode(dv.getUint8(g[1].at)) === 'S') lat = -lat;
            if (g[3] && String.fromCharCode(dv.getUint8(g[3].at)) === 'W') lng = -lng;
            if (lat && lng) { out.lat = lat; out.lng = lng; }
          }
        }
        if (out.date && !/^\d{4}-\d{2}-\d{2}$/.test(out.date)) delete out.date;
        return out;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      off += 2 + len;
    }
  } catch {}
  return {};
}
let snap = null;

    if (!pos && x.lat) pos = { lat: x.lat, lng: x.lng };
  }
  if (!date) { const d = new Date(Math.min(...files.map(f => f.lastModified || Date.now()))); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); date = d.toISOString().slice(0, 10); }

function aiCsv(){

/* =========================================================
   친구 (서로 수락해야 친구 · 친구 기록은 읽기만, 메모는 안 보임)
   ========================================================= */
const FR = { me: null, list: [], incoming: [], outgoing: [], prof: new Map(), data: new Map(), loadedAt: 0, pinsOn: false, pins: new Map() };
const HANDLE_RE = /^[a-z0-9_가-힣]{2,20}$/;
const frName = uid => FR.prof.get(uid)?.handle || '친구';
async function frLoad(force){
  if (!sb || !session) return false;
  if (!force && Date.now() - FR.loadedAt < 60000) return true;
  const me = session.user.id;
  const [p, f] = await Promise.all([
    sb.from('profiles').select('handle,name').eq('user_id', me).maybeSingle(),
    sb.from('friendships').select('requester,addressee,status')
  ]);
  if (p.error || f.error) { console.warn(p.error || f.error); return false; }
  FR.me = p.data || null;
  const rows = f.data || [];
  const other = r => r.requester === me ? r.addressee : r.requester;
  const acc = new Set(rows.filter(r => r.status === 'accepted').map(other));
  const inc = new Set(rows.filter(r => r.status === 'pending' && r.addressee === me).map(r => r.requester));
  const out = new Set(rows.filter(r => r.status === 'pending' && r.requester === me).map(r => r.addressee));
  // 서로 요청을 보낸 상태(꼬임)는 서버에서 친구로 합침
  const both = [...inc].filter(u => out.has(u) && !acc.has(u));
  if (both.length) { await Promise.all(both.map(u => sb.rpc('friend_request', { target: u }))); both.forEach(u => acc.add(u)); }
  FR.list = [...acc];
  FR.incoming = [...inc].filter(u => !acc.has(u));
  FR.outgoing = [...out].filter(u => !acc.has(u) && !inc.has(u));
  const ids = [...new Set([...FR.list, ...FR.incoming, ...FR.outgoing])];
  if (ids.length) { const { data } = await sb.from('profiles').select('user_id,handle,name').in('user_id', ids); (data || []).forEach(x => FR.prof.set(x.user_id, x)); }
  FR.loadedAt = Date.now();
  return true;
}
// 친구 한 명의 카페·방문 기록 (5분 동안 다시 안 받음)
async function frRecords(uid, force){
  const c = FR.data.get(uid);
  if (c && !force && Date.now() - c.at < 300000) return c;
  const { data, error } = await sb.rpc('friend_records', { fid: uid });
  if (error || !data) return c || { cafes: [], visits: [], at: 0 };
  const rec = { cafes: data.cafes || [], visits: data.visits || [], at: Date.now() };
  FR.data.set(uid, rec);
  return rec;
}
const frVisitsOf = (rec, cid) => rec.visits.filter(v => v.cafeId === cid).sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
function frStats(rec, c){
  const vs = frVisitsOf(rec, c.id), rs = vs.filter(v => v.rating);
  const avg = rs.length ? rs.reduce((s, v) => s + v.rating, 0) / rs.length : 0;
  const photos = vs.flatMap(v => v.photoIds || []);
  const cover = photos.includes(c.coverPhotoId) ? c.coverPhotoId : photos[0];
  return { count: vs.length, rating: +c.myRating || avg, last: vs[0], cover, photos };
}
// 친구 사진 (작은 사진만 받아서 이 화면 동안 기억)
const frPhotoURL = new Map();
async function frPhoto(uid, pid){
  if (!pid) return '';
  const k = uid + '/' + pid; if (frPhotoURL.has(k)) return frPhotoURL.get(k);
  const job = (async () => { try { const { data } = await sb.storage.from('photos').download(`${uid}/${pid}_t.jpg`); return data ? URL.createObjectURL(data) : ''; } catch { return ''; } })();
  frPhotoURL.set(k, job); return job;
}

async function frSetHandle(h){
  h = (h || '').trim().toLowerCase();

  FR.me = { handle: h }; toast('내 이름을 정했어요'); return true;
}
async function frRequest(h){
  h = (h || '').trim().toLowerCase();
  if (!h) return;
  if (h === FR.me?.handle) { toast('내 이름이에요'); return; }
  const { data: p } = await sb.from('profiles').select('user_id,handle,name').eq('handle', h).maybeSingle();
  if (!p) { toast(`'${h}' 이름을 가진 사람이 없어요`); return; }
  FR.prof.set(p.user_id, p);
  if (FR.list.includes(p.user_id)) { toast('이미 친구예요'); return; }
  if (FR.outgoing.includes(p.user_id)) { toast('이미 요청을 보냈어요'); return; }
  if (frBusy) return; frBusy = true;
  try {
    const { data, error } = await sb.rpc('friend_request', { target: p.user_id });
    if (error) { toast('요청을 보내지 못했어요'); return; }

/* 지도에 친구 핀 */
async function setFriendPins(on, focusUid){
  FR.pinsOn = on; $('#btnFriends').classList.toggle('on', on);
  if (!on) { FR.pins.forEach(o => o.setMap(null)); FR.pins.clear(); return; }
  if (!await frLoad()) { toast('친구 목록을 못 불러왔어요'); FR.pinsOn = false; $('#btnFriends').classList.remove('on'); return; }
  if (!FR.list.length) { toast('아직 친구가 없어요. 친구를 추가해 보세요'); FR.pinsOn = false; $('#btnFriends').classList.remove('on'); openFriends(); return; }
  await drawFriendPins(focusUid);
}
async function drawFriendPins(focusUid){
  FR.pins.forEach(o => o.setMap(null)); FR.pins.clear();
  if (!map || !FR.pinsOn) return;
  const recs = await Promise.all(FR.list.map(async u => [u, await frRecords(u)]));
  const mine = new Set(cafes.map(c => c.kakaoId).filter(Boolean));
  const groups = new Map(); // 같은 카페를 여러 친구가 갔으면 핀 하나로
  for (const [u, rec] of recs) for (const c of rec.cafes) {
    if (!c.lat || !c.lng) continue;
    const key = c.kakaoId || `${c.name}@${(+c.lat).toFixed(4)},${(+c.lng).toFixed(4)}`;
    if (!groups.has(key)) groups.set(key, { c, who: [] });
    groups.get(key).who.push({ uid: u, c });
  }
  const b = new kakao.maps.LatLngBounds(); let n = 0;
  for (const [key, g] of groups) {
    if (g.c.kakaoId && mine.has(g.c.kakaoId)) continue; // 내 핀이 이미 있는 곳은 내 핀으로
    const el = document.createElement('div');
    el.className = 'pin friend';
    el.innerHTML = `<div class="ring"><div>${cupIcon(g.c.id)}</div></div><div class="tip"></div><div class="nm">${esc(g.c.name)}</div><div class="fwho">${esc(g.who.map(w => frName(w.uid)).join(', '))}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openFriendSheet(g.who[0].uid, g.c, false, g.who); });
    const o = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(g.c.lat, g.c.lng), content: el, yAnchor: 1, clickable: true, zIndex: 1 });
    o.setMap(map); o._el = el; FR.pins.set(key, o);
    if (!focusUid || g.who.some(w => w.uid === focusUid)) { b.extend(new kakao.maps.LatLng(g.c.lat, g.c.lng)); n++; }
  }
  updateLabels();
  if (focusUid && n) { if (n > 1) map.setBounds(b, 90, 40, 120, 40); else { map.setLevel(4); map.setCenter(b.getSouthWest()); } }
  if (!focusUid) toast(`친구 카페 ${FR.pins.size}곳을 지도에 띄웠어요`);
}

    <div class="btnrow"><button class="btn" data-fwish="1">☆ 나도 가볼래</button><button class="btn ghost" data-fopen="${p0.uid}">${esc(frName(p0.uid))}님 목록</button></div>

  $('#sheet')._fr = { c };
  $('#sheet').classList.add('open'); $('#sheet').scrollTop = 0;

const SHARE_ID = new URLSearchParams(location.search).get('s');

  document.body.classList.add('sharemode');
  await initMap();
  if (!window.supabase) { $('#maperr').classList.remove('hidden'); $('#maperr').textContent = '인터넷 연결을 확인해 주세요.'; return; }

  $('#mapTop').insertAdjacentHTML('afterbegin', `<div class="sharetop"><div class="tt"><b>${esc(data.title)}</b><span>카페 ${list.length}곳${data.data?.owner ? ' · ' + esc(data.data.owner) + '님이 공유' : ''}</span></div><button id="sOpenList">목록</button></div>`);
  if (!map) return;
  const b = new kakao.maps.LatLngBounds();
  for (const c of list) {
    const el = document.createElement('div');
    el.className = 'pin' + (c.wish ? ' wish' : c.fav ? ' fav' : '');
    el.innerHTML = `<div class="ring"><div>${cupIcon(c.id)}</div></div><div class="tip"></div><div class="nm">${esc(c.name)}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); shareSheet(c); });
    const o = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(c.lat, c.lng), content: el, yAnchor: 1, clickable: true, zIndex: 2 });
    o.setMap(map); o._el = el; overlays.set(c.id, o);

  const fitShare = () => { if (list.length > 1) map.setBounds(b, 90, 40, 60, 40); else if (list.length) { map.setLevel(4); map.setCenter(new kakao.maps.LatLng(list[0].lat, list[0].lng)); } };
  fitShare(); $('#btnFit').onclick = () => { closeSheet(); fitShare(); };
  updateLabels();
  $('#sOpenList').onclick = () => {
    $('#sListTitle').textContent = data.title;
    const rows = [...list].sort((a,b) => (b.rating||0) - (a.rating||0) || a.name.localeCompare(b.name, 'ko'));
    $('#sListBody').innerHTML = rows.map(c => `<button class="item" data-sid="${c.id}" style="width:100%;text-align:left">
      <div class="thumbpol"><div style="${c.thumb ? `background-image:url('${c.thumb}')` : ''}">${c.thumb ? '' : cupIcon(c.id)}</div></div>
      <div class="info"><div class="nm">${c.wish ? '☆ ' : c.fav ? '<span style="color:var(--heartt)">♥</span> ' : ''}${esc(c.name)}</div><div class="ad">${esc(shortAddr(c))}</div>
      <div class="mini">${c.rating ? `<b>★ ${c.rating.toFixed(1)}</b>` : ''}${c.review ? `<span>${esc(c.review.slice(0,28))}${c.review.length > 28 ? '…' : ''}</span>` : ''}</div></div></button>`).join('');
    $('#sListBody').onclick = e => { const r = e.target.closest('[data-sid]'); if (!r) return; closePage('pSList'); shareSheet(list.find(x => x.id === r.dataset.sid), true); };
    openPage('pSList');
  };
}
function shareSheet(c, pan){
  overlays.forEach((o, k) => o._el.classList.toggle('sel', k === c.id));
  selectedId = c.id;
  $('#sheet').innerHTML = `<div class="grab"></div>
    ${c.thumb ? `<div class="pols" style="height:150px"><div class="pol" style="left:0;top:4px;transform:rotate(-3deg)"><div style="background-image:url('${c.thumb}')"></div></div></div>` : ''}
    <div class="rowsb"><div style="min-width:0"><div class="title">${esc(c.name)}</div><div class="subt">${esc(shortAddr(c))}${c.category ? ' · ' + esc(c.category.split(' > ').pop()) : ''}</div></div>${c.rating ? `<div class="score">★ ${c.rating.toFixed(1)}</div>` : ''}</div>
    <div style="margin-top:10px">${c.wish ? '<span class="tag wish">☆ 가볼래</span>' : ''}${c.fav ? '<span class="tag heart">♥ 또 갈래</span>' : ''}${(c.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    ${c.review || c.menu ? `<div class="note" style="margin-top:8px">${c.menu ? `<div class="meta">${esc(c.menu)}</div>` : ''}${esc(c.review || '')}</div>` : ''}
    <div class="linkrow" style="margin-top:14px">
      <a class="btn kakao" href="${kakaoUrl(c)}" target="_blank" rel="noopener">카카오맵</a>
      <a class="btn naver" href="${naverUrl(c)}" target="_blank" rel="noopener">네이버지도</a>
      <a class="btn ghost" href="https://map.kakao.com/link/to/${encodeURIComponent(c.name)},${c.lat},${c.lng}" target="_blank" rel="noopener">길찾기</a>
