<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카페지도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>카페지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=53197b8a3f18075ca99a32c87ef13c91&libraries=services&autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFDF9;--ink:#2A2522;--sub:#8A817A;--acc:#6F4E37;--onacc:#fff;--soft:#F3EBE3;--softt:#6F4E37;
  --note:#F7F2EC;--heart:#FCEFEF;--heartt:#B4475A;--line:#EDE5DC;--frame:#fff;--ph:#E7D3BE;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',-apple-system,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{outline:none}
.hidden{display:none!important}

/* ---------- 탭 공통 ---------- */
.view{position:fixed;inset:0;bottom:calc(64px + var(--safe-b));overflow:hidden}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100%}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:30}
.headbtns{display:flex;gap:8px;margin-top:10px}
.headbtns .chip{background:var(--soft);color:var(--softt);border-color:transparent}
.album h4{margin:22px 0 10px;font-size:15px;font-weight:700}
.album h4 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.albumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.albumgrid .pol{position:relative;padding:5px 5px 18px}
.albumgrid .pol>div:first-child{width:100%;height:auto;aspect-ratio:1/1.05}
.albumgrid .pol .cap{font-size:10px;bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pernav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.pernav .lbl{font-size:18px;font-weight:700}
.pernav .iconbtn{background:var(--note)}
.bars .row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bars .row .n{width:38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .row .b{flex:1;height:10px;border-radius:5px;background:var(--note);overflow:hidden}
.bars .row .b i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bars .row .v{width:44px;text-align:right;color:var(--sub);font-size:12px}
.mres{display:block;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.mres .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.mres .s{font-size:12px;color:var(--sub);margin-top:3px}
.mres .r{font-size:13px;margin-top:5px;line-height:1.5;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickres{background:var(--note);border-radius:18px;padding:16px;margin-top:18px;text-align:center}
.pickres .pols{margin:0 auto 4px;width:300px;max-width:100%}
.ckrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.ckrow .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--onacc);font-size:14px}
.ckrow.on .ck{background:var(--acc);border-color:var(--acc)}
.ckrow .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckrow .ad{font-size:12px;color:var(--sub)}
.linkbox{background:var(--note);border-radius:12px;padding:12px 14px;font-size:14px;word-break:break-all;margin-top:10px}
.shrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.shrow .info{flex:1;min-width:0}
.shrow .info b{display:block;font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shrow .info span{font-size:12px;color:var(--sub)}
.shrow button{font-size:13px;color:var(--softt);background:var(--soft);padding:7px 11px;border-radius:999px}
.sharetop{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.10);border:1px solid var(--line)}
.sharetop .tt{flex:1;min-width:0}
.sharetop .tt b{display:block;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sharetop .tt span{font-size:12px;color:var(--sub)}
.sharetop button{font-size:13px;background:var(--acc);color:var(--onacc);padding:8px 12px;border-radius:999px;flex:none}
body.sharemode #tabbar,body.sharemode #btnAdd,body.sharemode #btnPick,body.sharemode .searchbar,body.sharemode #mapChips{display:none!important}
body.sharemode .view{bottom:0}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--sub)}
#tabbar button.on{color:var(--acc)}
#tabbar svg{width:24px;height:24px}

/* ---------- 지도 ---------- */
#map{position:absolute;inset:0}
#mapTop{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 14px 0;z-index:9;pointer-events:none}
#results:not(.hidden)~#mapTop .chips{display:none}
#mapTop>*{pointer-events:auto}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:0 14px;height:50px;box-shadow:0 2px 10px rgba(0,0,0,.10);border:1px solid var(--line)}
.searchbar input{flex:1;border:0;background:none;font-size:16px;min-width:0}
.searchbar input::placeholder{color:var(--sub)}
.searchbar svg{width:20px;height:20px;color:var(--sub);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.mapbtns{position:absolute;right:14px;z-index:5;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
.roundbtn{width:46px;height:46px;border-radius:50%;background:var(--bg);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.roundbtn svg{width:22px;height:22px}
.roundbtn.add{background:var(--acc);color:var(--onacc);border-color:var(--acc);width:54px;height:54px}

/* 내 카페 핀 */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer;transform-origin:bottom center;transition:transform .15s}
.pin.sel{transform:scale(1.15);z-index:3}
.pin .ring{width:48px;height:48px;border-radius:50%;background:var(--frame);border:3px solid var(--acc);padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin .ring>div{width:100%;height:100%;border-radius:50%;background:var(--ph) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:18px}
.pin .tip{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--acc);margin-top:-1px}
.pin .nm{margin-top:3px;font-size:12px;background:var(--bg);color:var(--ink);padding:2px 8px;border-radius:999px;border:1px solid var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pin.fav .ring{border-color:var(--heartt)}
.pin.fav .tip{border-top-color:var(--heartt)}
.pin.wish .ring{border-style:dashed;border-color:var(--sub);background:var(--bg)}
.pin.wish .ring>div{background:var(--soft);color:var(--softt);font-size:20px}
.pin.wish .tip{border-top-color:var(--sub)}
.pin.wish .nm{border-style:dashed}
.tempPin{display:flex;flex-direction:column;align-items:center}
.tempPin .dot{width:22px;height:22px;border-radius:50%;background:var(--acc);border:4px solid var(--frame);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent)}
.mePin{width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.2)}

/* 바텀시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:8px 18px 18px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:78%;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}

/* 폴라로이드 */
.pols{position:relative;height:178px;margin:2px 0 6px}
.pol{position:absolute;background:var(--frame);padding:7px 7px 22px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.16);border:1px solid var(--line)}
.pol>div:first-child{width:104px;height:118px;background:var(--ph) center/cover no-repeat}
.pol .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:var(--sub)}
.pols.empty{height:auto}
.emptyPhoto{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--sub);font-size:14px}

.title{font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.subt{font-size:13px;color:var(--sub);margin-top:3px}
.rowsb{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{display:inline-block;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--softt);margin:0 4px 4px 0}
.tag.heart{background:var(--heart);color:var(--heartt)}
.tag.wish{background:transparent;color:var(--sub);border:1px dashed var(--sub)}
.btn.wishbtn{background:var(--bg);color:var(--ink);border:1.5px dashed var(--sub)}
.score{flex:none;background:var(--soft);color:var(--softt);font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.note{background:var(--note);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note .meta{font-size:12px;color:var(--sub);margin-bottom:4px;white-space:normal}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{text-decoration:none;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;padding:13px 10px;border-radius:14px;background:var(--acc);color:var(--onacc);text-align:center}
.btn.ghost{background:var(--soft);color:var(--softt)}
.btn.kakao{background:#FEE500;color:#191600}
.btn.naver{background:#03C75A;color:#fff}
.btn.danger{background:var(--heart);color:var(--heartt)}
.btn svg{width:18px;height:18px}
.linkrow{display:flex;gap:8px;margin-top:8px}
.linkrow .btn{padding:11px 8px;font-size:13px}

/* 검색 결과 */
#results{position:absolute;inset:0;z-index:7;background:var(--bg);padding-top:calc(74px + var(--safe-t));overflow-y:auto}
.res{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.res .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--softt);display:flex;align-items:center;justify-content:center;flex:none}
.res .ic svg{width:18px;height:18px}
.res .nm{font-size:16px}
.res .ad{font-size:13px;color:var(--sub);margin-top:2px}
.res .cat{font-size:12px;color:var(--sub);margin-top:2px}
.res .mine{font-size:11px;background:var(--acc);color:var(--onacc);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.res .dist{margin-left:auto;font-size:12px;color:var(--sub);flex:none;padding-top:3px}
.hint{padding:28px 18px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.textbtn{color:var(--acc);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* 목록 */
.pagehead{padding:calc(18px + var(--safe-t)) 18px 6px}
.pagehead h1{margin:0;font-size:24px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--sub);font-size:13px}
.listtools{padding:6px 18px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.listsearch{display:flex;align-items:center;gap:8px;background:var(--note);border-radius:12px;padding:0 12px;height:42px}
.listsearch input{flex:1;border:0;background:none;font-size:15px}
.listsearch svg{width:18px;height:18px;color:var(--sub)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.item{display:flex;gap:14px;padding:14px 18px;align-items:center;border-bottom:1px solid var(--line)}
.thumbpol{flex:none;background:var(--frame);padding:4px 4px 12px;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,.15);border:1px solid var(--line)}
.thumbpol>div{width:62px;height:62px;background:var(--ph) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
.item .info{flex:1;min-width:0}
.item .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ad{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mini{font-size:12px;color:var(--sub);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .mini b{color:var(--softt);font-weight:400;background:var(--soft);padding:2px 7px;border-radius:999px}
.empty{padding:60px 30px;text-align:center;color:var(--sub);line-height:1.8}
.empty .big{font-size:40px;margin-bottom:6px}

/* 풀스크린 페이지 (상세/편집) */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.page.open{transform:none}
.page .bar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 10px 10px;border-bottom:1px solid var(--line);flex:none}
.page .bar .t{flex:1;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink);flex:none}
.iconbtn svg{width:24px;height:24px}
.page .body{flex:1;overflow-y:auto;padding:16px 18px calc(30px + var(--safe-b))}
.sec{margin-top:24px}
.sec h3{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 small{font-size:13px;color:var(--sub);font-weight:400}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px;padding:6px 2px}
.wall .pol{position:relative}
.wall .pol>div:first-child{width:100%;height:auto;aspect-ratio:1/1.1}

.visit{position:relative;padding-left:20px;margin-bottom:18px}
.visit:before{content:"";position:absolute;left:5px;top:8px;bottom:-18px;width:2px;background:var(--line)}
.visit:last-child:before{display:none}
.visit:after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.visit .vh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:6px}
.visit .stars{color:#F2A93B;letter-spacing:1px}
.vphotos{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.vphotos::-webkit-scrollbar{display:none}
.vphotos .pol{position:relative;flex:none}
.vphotos .pol>div:first-child{width:84px;height:92px}
.small{font-size:12px;color:var(--sub)}
.vacts{display:flex;gap:14px;margin-top:6px}
.vacts button{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}

/* 폼 */
label.f{display:block;font-size:13px;color:var(--sub);margin:18px 0 7px}
.inp{width:100%;background:var(--note);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px}
.inp:focus{border-color:var(--acc);background:var(--bg)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}
.starpick{display:flex;gap:6px}
.starpick button{font-size:34px;line-height:1;color:var(--line)}
.starpick button.on{color:#F2A93B}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick .chip{background:var(--note);border-color:transparent}
.tagpick .chip.on{background:var(--acc);color:var(--onacc)}
.addph{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px}
.addph .pol{position:relative}
.addph .pol>div:first-child{width:86px;height:94px}
.addph .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px;display:flex;align-items:center;justify-content:center}
.addph .plus{width:102px;height:126px;border:1.5px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:13px}
.addph .plus svg{width:26px;height:26px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--note);border-radius:12px;padding:12px 14px;margin-top:18px}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--heartt)}
.sw.on:after{left:23px}
.savebar{flex:none;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}

/* 설정 */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{border-radius:16px;padding:12px;border:2px solid transparent;text-align:left}
.theme.on{border-color:var(--ink)}
.theme .sw3{display:flex;gap:4px;margin-bottom:8px}
.theme .sw3 span{width:20px;height:20px;border-radius:50%}
.theme .tn{font-size:14px}
.setrow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.setrow svg{width:22px;height:22px;color:var(--acc);flex:none}
.setrow small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.acct{background:var(--note);border-radius:16px;padding:16px}
.acct .who{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;border-radius:50%;background:var(--soft) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--softt);font-size:20px}
.acct .st{font-size:12px;color:var(--sub);margin-top:3px}
.btn.kakaologin{background:#FEE500;color:#191600}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3BB273;margin-right:5px;vertical-align:1px}
.syncdot.off{background:var(--sub)}
.syncdot.err{background:#D9534F}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--note);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700;color:var(--acc)}
.stat span{font-size:12px;color:var(--sub)}

/* 사진 크게 보기 */
#viewer{position:fixed;inset:0;z-index:60;background:rgba(20,16,14,.94);display:flex;align-items:center;justify-content:center;flex-direction:column}
#viewer .vpol{background:#fff;padding:12px 12px 46px;border-radius:4px;max-width:92vw;position:relative;transform:rotate(-1deg)}
#viewer img{display:block;max-width:calc(92vw - 24px);max-height:70vh;object-fit:contain}
#viewer .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#555;font-size:15px}

<script>
/* =========================================================
   설정값
   ========================================================= */
const TAGS = ['작업하기 좋음','조용함','디저트 맛집','커피 맛집','뷰 맛집','분위기 좋음','넓음','콘센트','주차 가능','애견 동반','대화하기 좋음','24시간'];
const THEMES = [
  {k:'coffee',  n:'커피 베이지', bg:'#FFFDF9',ink:'#2A2522',sub:'#8A817A',acc:'#6F4E37',onacc:'#fff',soft:'#F3EBE3',softt:'#6F4E37',note:'#F7F2EC',heart:'#FCEFEF',heartt:'#B4475A',line:'#EDE5DC',frame:'#fff',ph:'#E7D3BE'},
  {k:'matcha',  n:'말차 라떼',   bg:'#FBFCF7',ink:'#26302A',sub:'#7D877F',acc:'#5E7D55',onacc:'#fff',soft:'#E9F0E2',softt:'#476140',note:'#F2F5EC',heart:'#FBEFEA',heartt:'#B25B3E',line:'#E3E9DA',frame:'#fff',ph:'#DCE6CF'},
  {k:'vanilla', n:'바닐라 크림', bg:'#FFFCF2',ink:'#3A3226',sub:'#968A74',acc:'#C98A2E',onacc:'#fff',soft:'#FBEFD6',softt:'#8E5C14',note:'#FBF5E6',heart:'#FCEEEA',heartt:'#C0533C',line:'#F1E6CC',frame:'#fff',ph:'#F7E8C8'},
  {k:'berry',   n:'딸기 우유',   bg:'#FFFAFA',ink:'#3A2A2D',sub:'#9A8487',acc:'#D2647D',onacc:'#fff',soft:'#FBE6EB',softt:'#A84860',note:'#FCF1F3',heart:'#FBE6EB',heartt:'#C2405E',line:'#F4DFE4',frame:'#fff',ph:'#F8DDE3'},
  {k:'earlgrey',n:'얼그레이',    bg:'#F9F9FB',ink:'#2B2D35',sub:'#83869A',acc:'#6B6F9E',onacc:'#fff',soft:'#E8E9F3',softt:'#4E5285',note:'#F0F1F6',heart:'#F7ECF0',heartt:'#A8506E',line:'#E4E5EE',frame:'#fff',ph:'#DADCEA'},
  {k:'soda',    n:'소다 라떼',   bg:'#F8FCFF',ink:'#1F2C38',sub:'#7A8B99',acc:'#3E8FC6',onacc:'#fff',soft:'#E1F0FA',softt:'#2A6E9C',note:'#EEF6FC',heart:'#FCEDEE',heartt:'#C24B55',line:'#DCEAF4',frame:'#fff',ph:'#CFE5F4'},
  {k:'grapefruit',n:'자몽 에이드',bg:'#FFFAF7',ink:'#3A2621',sub:'#9C8178',acc:'#E2694A',onacc:'#fff',soft:'#FDE6DE',softt:'#B04A2F',note:'#FDF1EC',heart:'#FCE7EA',heartt:'#C2405E',line:'#F5E0D8',frame:'#fff',ph:'#F9D5C8'},
  {k:'blueberry',n:'블루베리 요거트',bg:'#FCFAFE',ink:'#2D2638',sub:'#8B8299',acc:'#7B5EA7',onacc:'#fff',soft:'#EEE7F7',softt:'#5D4388',note:'#F5F1FA',heart:'#FBEBF0',heartt:'#B3466B',line:'#ECE5F3',frame:'#fff',ph:'#E2D7F0'},
  {k:'sesame',  n:'흑임자',      bg:'#FAF9F7',ink:'#1F1E1C',sub:'#7F7B75',acc:'#3B3936',onacc:'#fff',soft:'#ECEAE6',softt:'#3B3936',note:'#F2F0EC',heart:'#F8ECEC',heartt:'#A8474F',line:'#E5E2DD',frame:'#fff',ph:'#D9D5CE'},
  {k:'night',   n:'밤 카페 (다크)',bg:'#221C18',ink:'#F3ECE4',sub:'#A99D91',acc:'#D7A86E',onacc:'#221C18',soft:'#3A302A',softt:'#E8C9A0',note:'#2D2520',heart:'#3D2A2C',heartt:'#F0A3B1',line:'#3A302A',frame:'#F3ECE4',ph:'#4E3E33'},
];

/* =========================================================
   작은 도우미
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = s => { if(!s) return ''; const [y,m,d] = s.split('-').map(Number); const now = new Date().getFullYear(); return (y!==now? y+'년 ':'') + m+'월 '+d+'일'; };
const won = n => n ? Number(n).toLocaleString('ko-KR') + '원' : '';
const stars = r => '★'.repeat(r||0) + '☆'.repeat(5-(r||0));
const ICON_CUP = '☕';
function hashRot(id, i){ let h = 0; for (const c of (id+i)) h = (h*31 + c.charCodeAt(0)) | 0; return ((Math.abs(h) % 9) - 4) * 0.9; }
function distKm(a, b){ const R=6371, t=x=>x*Math.PI/180; const dLa=t(b.lat-a.lat), dLo=t(b.lng-a.lng); const s=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const fmtDist = km => km == null ? '' : km < 1 ? Math.round(km*1000)+'m' : km.toFixed(km<10?1:0)+'km';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2000); }
function loading(on, msg){ $('#loadingMsg').textContent = msg || '잠시만요…'; $('#loading').classList.toggle('hidden', !on); }
function ask(msg, okText='확인', danger=false){
  return new Promise(res => {
    $('#dlgMsg').textContent = msg;
    $('#dlgBtns').innerHTML = `<button class="btn ghost" data-v="0">취소</button><button class="btn ${danger?'danger':''}" data-v="1">${esc(okText)}</button>`;
    $('#dlg').classList.remove('hidden');
    $('#dlgBtns').onclick = e => { const b = e.target.closest('button'); if(!b) return; $('#dlg').classList.add('hidden'); res(b.dataset.v === '1'); };
  });
}

/* =========================================================
   저장소 (IndexedDB) — 카페, 방문기록, 사진
   ========================================================= */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('cafe-map', 2);
    r.onupgradeneeded = (e) => { const d = r.result;
      if (e.oldVersion < 1) {
        d.createObjectStore('cafes', {keyPath:'id'});
        const v = d.createObjectStore('visits', {keyPath:'id'}); v.createIndex('cafeId','cafeId');
        d.createObjectStore('photos', {keyPath:'id'});
      }
      if (e.oldVersion < 2) d.createObjectStore('tomb', {keyPath:'id'}); // 지운 기록 (서버에 알려줄 목록)
    };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });},
  tx(store, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error);
  });},
  all(store){ return this.tx(store, 'readonly', s => s.getAll()); },
  get(store, id){ return this.tx(store, 'readonly', s => s.get(id)); },
  put(store, obj){ return this.tx(store, 'readwrite', s => s.put(obj)); },
  del(store, id){ return this.tx(store, 'readwrite', s => s.delete(id)); },
  clear(store){ return this.tx(store, 'readwrite', s => s.clear()); },
};
async function tomb(kind, id, extra){ try { await DB.put('tomb', { id: kind + ':' + id, kind, rid: id, ...(extra||{}) }); } catch {} }

let cafes = [], visits = [];
const photoURL = new Map(); // photoId -> {full, thumb}

async function loadAll(){
  cafes = await DB.all('cafes'); visits = await DB.all('visits');
}
async function getPhotoURL(id, kind='thumb'){
  if (!id) return '';
  let rec = photoURL.get(id);
  if (rec && rec[kind]) return rec[kind];
  let p = await DB.get('photos', id);
  if (!p || !(p[kind] || (kind === 'thumb' && p.full))) p = await fetchRemotePhoto(id, kind, p);
  if (!p) return '';
  rec = photoURL.get(id) || {};
  if (p.full && !rec.full) rec.full = URL.createObjectURL(p.full);
  if (p.thumb && !rec.thumb) rec.thumb = URL.createObjectURL(p.thumb);
  if (!rec.thumb && rec.full) rec.thumb = rec.full;
  photoURL.set(id, rec);
  return rec[kind] || rec.thumb || rec.full || '';
}
// 이 기기에 없는 사진은 서버에서 받아와 저장 (다른 기기에서 찍은 사진)
const photoFetching = new Map();
function fetchRemotePhoto(id, kind, existing){
  if (!sb || !session) return Promise.resolve(existing);
  const key = id + ':' + kind;
  if (photoFetching.has(key)) return photoFetching.get(key);
  const job = (async () => {
    try {
      const path = `${session.user.id}/${id}${kind === 'thumb' ? '_t' : ''}.jpg`;
      const { data, error } = await sb.storage.from('photos').download(path);
      if (error || !data) return existing;
      const cur = (await DB.get('photos', id)) || { id };
      cur[kind] = data; cur.uploaded = true;
      await DB.put('photos', cur);
      return cur;
    } catch { return existing; }
    finally { photoFetching.delete(key); }
  })();
  photoFetching.set(key, job);
  return job;
}
const visitsOf = cid => visits.filter(v => v.cafeId === cid).sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.createdAt - a.createdAt);
function cafeStats(c){
  const vs = visitsOf(c.id); const rs = vs.filter(v => v.rating);
  return { count: vs.length, rating: rs.length ? rs.reduce((s,v)=>s+v.rating,0)/rs.length : 0, last: vs[0]?.date || '', lastVisit: vs[0], photos: vs.flatMap(v => v.photoIds||[]) };
}

/* 사진 줄이기: 원본 최대 1600px, 썸네일 360px */
async function shrink(file, max, q){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
async function savePhoto(file){
  const id = uid();
  const full = await shrink(file, 1600, .84), thumb = await shrink(file, 360, .8);
  await DB.put('photos', {id, full, thumb, uploaded: false});
  return id;
}

function applyTheme(k){
  const t = THEMES.find(x => x.k === k) || THEMES[0];
  const r = document.documentElement.style;
  for (const key of ['bg','ink','sub','acc','onacc','soft','softt','note','heart','heartt','line','frame','ph']) r.setProperty('--'+key, t[key]);
  document.querySelector('meta[name=theme-color]').content = t.bg;
  try { localStorage.setItem('theme', t.k); } catch {}
  renderThemes();
}
function renderThemes(){
  let cur = 'coffee'; try { cur = localStorage.getItem('theme') || 'coffee'; } catch {}
  $('#themes').innerHTML = THEMES.map(t => `<button class="theme ${t.k===cur?'on':''}" data-k="${t.k}" style="background:${t.bg};color:${t.ink};box-shadow:inset 0 0 0 1px ${t.line}">
    <div class="sw3"><span style="background:${t.acc}"></span><span style="background:${t.soft}"></span><span style="background:${t.heartt}"></span></div>
    <div class="tn">${t.n}</div></button>`).join('');
}

let map, places, overlays = new Map(), tempOverlay = null, meOverlay = null, myPos = null, selectedId = null;
let mapFilter = '전체';

function initMap(){
  return new Promise(res => {
    if (!window.kakao || !kakao.maps) { mapFail(); return res(); }
    kakao.maps.load(() => {
      let center = new kakao.maps.LatLng(35.8714, 128.6014); // 대구 동성로 근처
      try { const s = JSON.parse(localStorage.getItem('mapView')); if (s) center = new kakao.maps.LatLng(s.lat, s.lng); } catch {}
      let level = 5; try { level = JSON.parse(localStorage.getItem('mapView'))?.level || 5; } catch {}
      map = new kakao.maps.Map($('#map'), { center, level });
      places = new kakao.maps.services.Places();
      kakao.maps.event.addListener(map, 'click', e => onMapTap(e.latLng));
      kakao.maps.event.addListener(map, 'idle', () => {
        const c = map.getCenter();
        try { localStorage.setItem('mapView', JSON.stringify({lat:c.getLat(), lng:c.getLng(), level:map.getLevel()})); } catch {}
        updateLabels();
      });
      res();
    });
  });
}
function mapFail(){
  $('#maperr').classList.remove('hidden');
  $('#maperr').innerHTML = '지도를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침 해주세요.<br><span class="small">목록 탭에서 기록은 그대로 볼 수 있어요.</span>';
}
function updateLabels(){
  if (!map) return;
  const show = map.getLevel() <= 6;
  document.querySelectorAll('.pin .nm').forEach(e => e.style.display = show ? '' : 'none');
}
function passFilter(c, f){
  if (f === '전체') return true;
  if (f === '♥ 또 갈래') return !!c.fav;
  if (f === '다녀온 곳') return !c.wish;
  if (f === '☆ 가보고 싶은 곳') return !!c.wish;
  return (c.tags||[]).includes(f);
}
async function refreshPins(){
  if (!map) return;
  for (const o of overlays.values()) o.setMap(null);
  overlays.clear();
  for (const c of cafes) {
    if (!passFilter(c, mapFilter)) continue;
    const st = cafeStats(c);
    const cover = c.coverPhotoId || st.photos[0];
    const el = document.createElement('div');
    el.className = 'pin' + (c.wish ? ' wish' : c.fav ? ' fav' : '') + (c.id === selectedId ? ' sel' : '');
    const url = cover ? await getPhotoURL(cover) : '';
    el.innerHTML = `<div class="ring"><div style="${url?`background-image:url('${url}')`:''}">${url?'':(c.wish?'☆':ICON_CUP)}</div></div><div class="tip"></div><div class="nm">${esc(c.name)}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openSheet(c.id); });
    const o = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(c.lat, c.lng), content: el, yAnchor: 1, clickable: true, zIndex: c.id===selectedId?5:2 });
    o.setMap(map); o._el = el;
    overlays.set(c.id, o);
  }
  updateLabels();
  renderChips();
}
function fitAll(){
  const list = cafes.filter(c => passFilter(c, mapFilter));
  if (!map || !list.length) { toast('아직 기록한 카페가 없어요'); return; }
  if (list.length === 1) { map.setLevel(4); map.panTo(new kakao.maps.LatLng(list[0].lat, list[0].lng)); return; }
  const b = new kakao.maps.LatLngBounds(); list.forEach(c => b.extend(new kakao.maps.LatLng(c.lat, c.lng)));
  map.setBounds(b, 80, 40, 120, 40);
}
function locate(pan=true){
  return new Promise(res => {
    if (!navigator.geolocation) { toast('이 브라우저는 위치를 지원하지 않아요'); return res(null); }
    navigator.geolocation.getCurrentPosition(p => {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (map) {
        const ll = new kakao.maps.LatLng(myPos.lat, myPos.lng);
        if (!meOverlay) { const d = document.createElement('div'); d.className = 'mePin'; meOverlay = new kakao.maps.CustomOverlay({ position: ll, content: d, zIndex: 1 }); }
        meOverlay.setPosition(ll); meOverlay.setMap(map);
        if (pan) { map.setLevel(Math.min(map.getLevel(), 4)); map.panTo(ll); }
      }
      res(myPos);
    }, () => { toast('위치 권한을 허용하면 내 위치를 볼 수 있어요'); res(null); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
function renderChips(){
  const used = new Set(cafes.flatMap(c => c.tags||[]));
  const list = ['전체','다녀온 곳','☆ 가보고 싶은 곳','♥ 또 갈래', ...TAGS.filter(t => used.has(t))];

}

}

function centerAbove(lat, lng){
  if (!map) return;
  map.setCenter(new kakao.maps.LatLng(lat, lng));
  const h = $('#sheet').classList.contains('open') ? $('#sheet').offsetHeight : 0;
  const vh = $('#map').offsetHeight;
  const dy = Math.max(0, Math.min(h, vh - 160) / 2);
  if (dy) map.panBy(0, dy);
}
function closeSheet(){
  $('#sheet').classList.remove('open'); selectedId = null;
  overlays.forEach(o => { o._el.classList.remove('sel'); o.setZIndex(2); });
  removeTemp(); setMapBtnBottom();
}

function doSearch(){
  const q = qEl.value.trim(); if (!q) return;
  $('#results').classList.remove('hidden'); closeSheet();
  if (!places) { $('#results').innerHTML = '<div class="hint">지도가 아직 준비되지 않았어요.</div>'; return; }
  const opt = { size: 15 };
  if (map) { opt.location = map.getCenter(); opt.sort = kakao.maps.services.SortBy.ACCURACY; }
  places.keywordSearch(q, (data, status) => {
    if (status === kakao.maps.services.Status.ZERO_RESULT) {
      $('#results').innerHTML = `<div class="hint">'${esc(q)}' 검색 결과가 없어요.<br><br><button class="textbtn" id="manualAdd">지도 가운데 위치에 직접 등록하기</button></div>`;

      return `<button class="res" data-i="${i}" style="width:100%;text-align:left">

    $('#results').onclick = e => { const b = e.target.closest('.res'); if (b) pickPlace(data[+b.dataset.i]); };

// 지도에서 카페·식당 아이콘을 누르면, 누른 자리 바로 아래 장소를 찾아 카드로 보여줌
let tapSeq = 0;
async function onMapTap(ll){
  if (SHARE_ID) { closeSheet(); return; }
  if ($('#sheet').classList.contains('open')) { closeSheet(); return; }
  if (!places || !$('#results').classList.contains('hidden')) return;
  const seq = ++tapSeq;
  // 지도 확대 정도에 따라 찾는 반경을 조절 (멀리 보면 넓게)
  const lv = map.getLevel(), radius = lv <= 2 ? 15 : lv <= 3 ? 25 : lv <= 4 ? 40 : 0;
  if (!radius) { toast('지도를 조금 더 확대한 뒤 눌러주세요'); return; }
  const opt = { x: ll.getLng(), y: ll.getLat(), radius, sort: kakao.maps.services.SortBy.DISTANCE };
  const found = [];
  for (const code of ['CE7', 'FD6']) {
    found.push(...await new Promise(res => places.categorySearch(code, (d, st) => res(st === kakao.maps.services.Status.OK ? d : []), opt)));
  }
  if (seq !== tapSeq) return;
  if (!found.length) return;
  found.sort((a, b) => (+a.distance) - (+b.distance));
  pickPlace(found[0], true);
}
function removeTemp(){ if (tempOverlay) { tempOverlay.setMap(null); tempOverlay = null; } pendingPlace = null; }
function pickPlace(p, fromTap){
  $('#results').classList.add('hidden'); $('#qClear').classList.add('hidden'); qEl.blur();
  const mine = cafes.find(c => c.kakaoId === p.id);
  const ll = new kakao.maps.LatLng(+p.y, +p.x);
  if (!fromTap) { map.setLevel(Math.min(map.getLevel(), 3)); map.setCenter(ll); }
  if (mine) { openSheet(mine.id); return; }
  closeSheet();
  pendingPlace = { kakaoId: p.id, name: p.place_name, address: p.address_name, roadAddress: p.road_address_name, lat: +p.y, lng: +p.x, kakaoUrl: p.place_url, phone: p.phone, category: p.category_name };
  const el = document.createElement('div'); el.className = 'tempPin'; el.innerHTML = '<div class="dot"></div>';
  tempOverlay = new kakao.maps.CustomOverlay({ position: ll, content: el, yAnchor: .5, zIndex: 6 }); tempOverlay.setMap(map);
  const c = pendingPlace;
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="title">${esc(c.name)}</div>
    <div class="subt">${esc(c.roadAddress || c.address)}</div>
    ${c.category ? `<div class="subt">${esc(c.category.split(' > ').slice(-2).join(' · '))}${c.phone?' · '+esc(c.phone):''}</div>` : ''}
    <div class="btnrow"><button class="btn" data-act="saveNew">다녀왔어요 · 기록하기</button><button class="btn wishbtn" data-act="saveWish">☆ 가보고 싶어요</button></div>
    <div class="linkrow">
      <a class="btn kakao" href="${kakaoUrl(c)}" target="_blank" rel="noopener">카카오맵</a>
      <a class="btn naver" href="${naverUrl(c)}" target="_blank" rel="noopener">네이버지도</a>
    </div>`;
  $('#sheet').classList.add('open');
  requestAnimationFrame(() => { setMapBtnBottom(); centerAbove(c.lat, c.lng); });
}
function manualAdd(name){
  if (!map) return;
  const ctr = map.getCenter();
  $('#results').classList.add('hidden'); $('#qClear').classList.add('hidden');
  pendingPlace = { kakaoId: '', name: name || '', address: '', roadAddress: '', lat: ctr.getLat(), lng: ctr.getLng(), kakaoUrl: '', category: '' };
  new kakao.maps.services.Geocoder().coord2Address(ctr.getLng(), ctr.getLat(), (r, s) => {
    if (s === kakao.maps.services.Status.OK && r[0]) { pendingPlace.address = r[0].address?.address_name || ''; pendingPlace.roadAddress = r[0].road_address?.address_name || ''; }
    openCafeEditor(null, pendingPlace);
  });
}
async function saveNewFromPlace(wish){
  if (!pendingPlace) return;
  openCafeEditor(null, { ...pendingPlace, wish: !!wish });
}

$('#cSave').onclick = async () => {

  if (!c.name) { toast('카페 이름을 적어주세요'); return; }

  c.fav = $('#cFav').classList.contains('on');
  c.wish = $('#cWish').classList.contains('on');
  c.tags = [...document.querySelectorAll('#cTags .chip.on')].map(b => b.dataset.t);
  c.memo = $('#cMemo').value.trim();
  c.updatedAt = Date.now(); c.dirty = true;
  await DB.put('cafes', c); Sync.soon();
  const i = cafes.findIndex(x => x.id === c.id); if (i >= 0) cafes[i] = c; else cafes.push(c);
  const wasNew = editingCafe.isNew;
  closePage('pCafe'); removeTemp(); await refreshAll();
  if (wasNew && c.wish) { toast('가보고 싶은 곳에 저장했어요'); openSheet(c.id); }
  else if (wasNew) { toast('카페를 지도에 꽂았어요'); openSheet(c.id); openVisitEditor(c.id); }
  else { toast('저장했어요'); if (isOpen('pDetail')) openDetail(c.id, true); }

async function deleteCafe(id){
  const c = cafes.find(x => x.id === id);
  if (!await ask(`'${c.name}' 기록을 전부 지울까요?\n방문 기록과 사진도 함께 지워지고 되돌릴 수 없어요.`, '삭제', true)) return;
  for (const v of visitsOf(id)) {
    for (const p of v.photoIds||[]) { await DB.del('photos', p); photoURL.delete(p); await tomb('photo', p); }
    await DB.del('visits', v.id); await tomb('visit', v.id, { cafeId: id });
  }
  await DB.del('cafes', id); await tomb('cafe', id); Sync.soon();
  cafes = cafes.filter(x => x.id !== id); visits = visits.filter(v => v.cafeId !== id);
  closePage('pCafe'); closePage('pDetail'); closeSheet(); await refreshAll(); toast('삭제했어요');
}

async function renderVisitPhotos(){

let vList = [], vIdx = 0;

let tx0 = null;

const SORTS = [['recent','최근 방문순'],['name','이름순'],['dist','거리순'],['rating','별점순'],['count','기록 많은 순']];

async function renderList(){
  renderSort();
  const q = $('#lq').value.trim().toLowerCase();
  const base = myPos || (map ? { lat: map.getCenter().getLat(), lng: map.getCenter().getLng() } : null);
  let rows = cafes.filter(c => passFilter(c, listFilter)).map(c => ({ c, st: cafeStats(c), d: base ? distKm(base, c) : null }));
  if (q) rows = rows.filter(({c}) => [c.name, c.address, c.roadAddress, c.memo, ...(c.tags||[]), ...visitsOf(c.id).flatMap(v => [v.menu, v.review])].join(' ').toLowerCase().includes(q));
  const by = {
    recent: (a,b) => (b.st.last||'').localeCompare(a.st.last||'') || b.c.createdAt - a.c.createdAt,
    name: (a,b) => a.c.name.localeCompare(b.c.name, 'ko'),
    dist: (a,b) => (a.d??1e9) - (b.d??1e9),
    rating: (a,b) => b.st.rating - a.st.rating || b.st.count - a.st.count,
    count: (a,b) => b.st.count - a.st.count || (b.st.last||'').localeCompare(a.st.last||''),
  }[sortBy];
  rows.sort(by);
  $('#listCount').textContent = cafes.length ? `카페 ${cafes.length}곳 · 방문 기록 ${visits.length}개` : '';
  if (!cafes.length) { $('#list').innerHTML = `<div class="empty"><div class="big">☕</div>아직 기록한 카페가 없어요.<br>지도 탭에서 다녀온 카페를 검색해 보세요.</div>`; return; }
  if (!rows.length) { $('#list').innerHTML = `<div class="empty">조건에 맞는 카페가 없어요.</div>`; return; }
  const html = await Promise.all(rows.map(async ({c, st, d}) => {
    const cover = c.coverPhotoId || st.photos[0]; const url = cover ? await getPhotoURL(cover) : '';
    return `<button class="item" data-id="${c.id}" style="width:100%;text-align:left">
      <div class="thumbpol" style="transform:rotate(${hashRot(c.id,0)}deg)"><div style="${url?`background-image:url('${url}')`:''}">${url?'':ICON_CUP}</div></div>
      <div class="info"><div class="nm">${c.wish?'<span style="color:var(--sub)">☆</span> ':c.fav?'<span style="color:var(--heartt)">♥</span> ':''}${esc(c.name)}</div>
      <div class="ad">${esc(shortAddr(c))}${d!=null?' · '+fmtDist(d):''}</div>
      <div class="mini">${st.rating?`<b>★ ${st.rating.toFixed(1)}</b>`:''}<span>${c.wish && !st.count ? '가보고 싶은 곳' : `방문 기록 ${st.count}개`}</span>${st.last?`<span>${fmtDate(st.last)}</span>`:''}</div></div></button>`;
  }));
  $('#list').innerHTML = html.join('');
}

const blobToB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const b64ToBlob = async s => (await fetch(s)).blob();
$('#btnExport').onclick = async () => {
  loading(true, '백업 파일 만드는 중…');
  try {
    const ps = await DB.all('photos');
    const photos = [];
    for (const p of ps) { if (!p.full && !p.thumb) continue; photos.push({ id: p.id, full: p.full ? await blobToB64(p.full) : null, thumb: p.thumb ? await blobToB64(p.thumb) : null }); }
    const strip = o => { const { dirty, ...r } = o; return r; };

};

const SB_URL = 'https://wqzndhwuylzpgauoldpv.supabase.co';
const SB_KEY = 'sb_publishable_wWm5yjFWWvo0U2v9n4NglQ_X2RrFYjP'; // 공개용 키 (브라우저에 넣어도 되는 키)
let sb = null, session = null;
const syncState = { running: false, again: false, timer: null, last: null, error: '' };
try { syncState.last = localStorage.getItem('lastSyncAt'); } catch {}

const Sync = {
  async init(){

    loading(true, '마지막으로 올리는 중…');
    await Sync.run();
    const pending = (await DB.all('cafes')).some(c => c.dirty !== false) || (await DB.all('visits')).some(v => v.dirty !== false) || (await DB.all('tomb')).length || (await DB.all('photos')).some(p => !p.uploaded && p.full);
    loading(false);
    if (pending && !await ask('아직 서버에 못 올린 기록이 있어요.\n지금 로그아웃하면 그 기록은 사라져요. 그래도 할까요?', '그래도 로그아웃', true)) return;
    try { await sb.auth.signOut(); } catch {}
    for (const st of ['cafes', 'visits', 'photos', 'tomb']) await DB.clear(st);
    try { Object.keys(localStorage).filter(k => k.startsWith('lastPull:')).forEach(k => localStorage.removeItem(k)); localStorage.removeItem('lastSyncAt'); } catch {}
    photoURL.clear(); session = null; syncState.last = null;
    await loadAll(); closeSheet(); await refreshAll(); renderAccount(); toast('로그아웃했어요');
  },
  soon(){ if (!session) return; clearTimeout(syncState.timer); syncState.timer = setTimeout(() => Sync.run(), 1200); },
  async run(isFirst){
    if (!sb || !session) return;
    if (syncState.running) { syncState.again = true; return; }
    syncState.running = true; syncState.error = ''; renderAccount();
    let changed = false;
    try {
      const me = session.user.id;
      const strip = o => { const { dirty, ...r } = o; return r; };
      // 1) 아직 안 올린 사진 올리기
      for (const p of await DB.all('photos')) {
        if (p.uploaded || !p.full) continue;
        let r = await sb.storage.from('photos').upload(`${me}/${p.id}.jpg`, p.full, { upsert: true, contentType: 'image/jpeg' });
        if (r.error) throw r.error;
        if (p.thumb) { r = await sb.storage.from('photos').upload(`${me}/${p.id}_t.jpg`, p.thumb, { upsert: true, contentType: 'image/jpeg' }); if (r.error) throw r.error; }
        const cur = await DB.get('photos', p.id); if (cur) { cur.uploaded = true; await DB.put('photos', cur); }
      }
      // 2) 바뀐 카페, 방문 기록 올리기
      for (const [store, toRow] of [
        ['cafes',  c => ({ user_id: me, id: c.id, data: strip(c), deleted: false })],
        ['visits', v => ({ user_id: me, id: v.id, cafe_id: v.cafeId, data: strip(v), deleted: false })],
      ]) {
        const dirty = (await DB.all(store)).filter(x => x.dirty !== false);
        for (let i = 0; i < dirty.length; i += 200) {
          const chunk = dirty.slice(i, i + 200);
          const { error } = await sb.from(store).upsert(chunk.map(toRow));
          if (error) throw error;
          for (const x of chunk) { const cur = await DB.get(store, x.id); if (cur && (cur.updatedAt || 0) === (x.updatedAt || 0)) { cur.dirty = false; await DB.put(store, cur); } }
        }
      }
      // 3) 지운 것 알리기
      for (const t of await DB.all('tomb')) {
        if (t.kind === 'photo') { await sb.storage.from('photos').remove([`${me}/${t.rid}.jpg`, `${me}/${t.rid}_t.jpg`]); }
        else {
          const row = { user_id: me, id: t.rid, data: {}, deleted: true };
          if (t.kind === 'visit') row.cafe_id = t.cafeId || '';
          const { error } = await sb.from(t.kind === 'cafe' ? 'cafes' : 'visits').upsert(row);
          if (error) throw error;
        }
        await DB.del('tomb', t.id);
      }
      // 4) 다른 기기에서 바뀐 것 받아오기
      const key = 'lastPull:' + me;
      let since = '1970-01-01T00:00:00+00:00'; try { since = localStorage.getItem(key) || since; } catch {}
      let newest = since;
      for (const store of ['cafes', 'visits']) {
        let from = since;
        for (;;) {
          const { data, error } = await sb.from(store).select('id,data,deleted,updated_at').gt('updated_at', from).order('updated_at').limit(500);
          if (error) throw error;
          for (const row of data) {
            if (await applyRemote(store, row)) changed = true;
            if (row.updated_at > newest) newest = row.updated_at;
          }
          if (data.length < 500) break;
          from = data[data.length - 1].updated_at;
        }
      }
      try { localStorage.setItem(key, newest); } catch {}
      syncState.last = new Date().toISOString(); try { localStorage.setItem('lastSyncAt', syncState.last); } catch {}
    } catch (e) {
      syncState.error = navigator.onLine === false ? '인터넷 연결이 없어요' : '서버와 맞추지 못했어요';
      console.warn('sync', e);
    }
    syncState.running = false;
    if (changed) { await loadAll(); await refreshAll(); if (isOpen('pDetail') && detailId) openDetail(detailId, true); }
    renderAccount();
    if (syncState.again) { syncState.again = false; Sync.run(); }
  },
};
async function applyRemote(store, row){
  const local = await DB.get(store, row.id);
  if (row.deleted) {
    if (!local) return false;
    await DB.del(store, row.id);
    if (store === 'visits') for (const p of local.photoIds || []) { await DB.del('photos', p); photoURL.delete(p); }
    return true;
  }
  const remote = row.data || {};
  if (local && local.dirty !== false && (local.updatedAt || 0) > (remote.updatedAt || 0)) return false; // 이 기기 것이 더 최신
  await DB.put(store, { ...remote, id: row.id, dirty: false });
  return true;
}

let recMode = 'album';
const nowD = new Date();
const statPer = { y: nowD.getFullYear(), m: nowD.getMonth() + 1, year: false };
const cafeById = id => cafes.find(c => c.id === id);
const areaOf = c => { const p = (c?.address || c?.roadAddress || '').split(' '); return p.length >= 3 ? p[1] + ' ' + p[2] : (p[1] || '기타'); };
function renderRec(){

// 앨범: 찍은 사진을 날짜순 폴라로이드로
async function renderAlbum(){
  const body = $('#recBody');
  const vs = [...visits].filter(v => (v.photoIds||[]).length).sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.createdAt - a.createdAt);
  const items = [];
  for (const v of vs) { const c = cafeById(v.cafeId); for (const p of v.photoIds) items.push({ id: p, cap: (c?.name || '') + (v.date ? ' · ' + fmtDate(v.date) : ''), date: v.date || '', cafe: c?.name || '' }); }
  if (!items.length) { body.innerHTML = `<div class="empty"><div class="big">📷</div>방문 기록에 사진을 넣으면<br>여기 폴라로이드로 모여요.</div>`; return; }
  const groups = new Map();
  for (const it of items) { const k = it.date ? it.date.slice(0,7) : '날짜 모름'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }

// 결산: 월별 / 연도별
function renderStats(){
  const body = $('#recBody');
  const inPer = v => { if (!v.date) return false; const y = +v.date.slice(0,4), m = +v.date.slice(5,7); return statPer.year ? y === statPer.y : (y === statPer.y && m === statPer.m); };
  const vs = visits.filter(inPer);
  const label = statPer.year ? `${statPer.y}년` : `${statPer.y}년 ${statPer.m}월`;
  const nav = `<div class="pernav"><button class="iconbtn" data-nav="-1" aria-label="이전">‹</button><div class="lbl">${label}</div><button class="iconbtn" data-nav="1" aria-label="다음">›</button></div>
    <div class="seg" style="padding-top:0"><button class="chip ${!statPer.year?'on':''}" data-per="m">월별</button><button class="chip ${statPer.year?'on':''}" data-per="y">연도별</button></div>`;
  if (!vs.length) {
    body.innerHTML = nav + `<div class="empty" style="padding-top:30px">이 기간엔 방문 기록이 없어요.<br><span class="small">날짜를 넣은 방문 기록만 결산에 잡혀요.</span></div>`;
  } else {
    const spent = vs.reduce((s,v) => s + (+v.price||0), 0);
    const photos = vs.reduce((s,v) => s + (v.photoIds||[]).length, 0);
    const byCafe = new Map(); vs.forEach(v => byCafe.set(v.cafeId, (byCafe.get(v.cafeId)||0) + 1));
    const top = [...byCafe].sort((a,b) => b[1]-a[1]).slice(0,5);
    const rated = new Map(); vs.filter(v => v.rating).forEach(v => { const r = rated.get(v.cafeId) || [0,0]; r[0] += v.rating; r[1]++; rated.set(v.cafeId, r); });
    const best = [...rated].map(([id,[s,n]]) => [id, s/n]).sort((a,b) => b[1]-a[1]).slice(0,5);
    const byArea = new Map(); vs.forEach(v => { const a = areaOf(cafeById(v.cafeId)); byArea.set(a, (byArea.get(a)||0) + 1); });
    const areas = [...byArea].sort((a,b) => b[1]-a[1]).slice(0,8);
    const firstVisit = new Map(); [...visits].filter(v => v.date).sort((a,b) => a.date.localeCompare(b.date)).forEach(v => { if (!firstVisit.has(v.cafeId)) firstVisit.set(v.cafeId, v); });
    const newOnes = [...firstVisit.values()].filter(inPer).length;
    const bars = (rows, fmt) => { const mx = Math.max(...rows.map(r => r[1])); return `<div class="bars">${rows.map(([n,v]) => `<div class="row"><div class="n">${esc(n)}</div><div class="b"><i style="width:${Math.max(6, v/mx*100)}%"></i></div><div class="v">${fmt(v)}</div></div>`).join('')}</div>`; };
    body.innerHTML = nav + `
      <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-top:6px">
        <div class="stat"><b>${vs.length}</b><span>방문 기록</span></div>
        <div class="stat"><b>${byCafe.size}</b><span>간 카페 (새로 ${newOnes}곳)</span></div>
        <div class="stat"><b>${spent ? spent.toLocaleString('ko-KR') : '-'}</b><span>쓴 돈 (원)</span></div>
        <div class="stat"><b>${photos}</b><span>찍은 사진</span></div>
      </div>
      <div class="sec"><h3>제일 많이 간 곳</h3>${bars(top.map(([id,n]) => [cafeById(id)?.name || '?', n]), v => v + '번')}</div>
      ${best.length ? `<div class="sec"><h3>별점 TOP ${best.length}</h3>${bars(best.map(([id,r]) => [cafeById(id)?.name || '?', r]), v => '★ ' + v.toFixed(1))}</div>` : ''}
      <div class="sec"><h3>동네별</h3>${bars(areas, v => v + '번')}</div>`;
  }
  body.onclick = e => {
    const n = e.target.closest('[data-nav]');
    if (n) { const d = +n.dataset.nav; if (statPer.year) statPer.y += d; else { statPer.m += d; if (statPer.m < 1) { statPer.m = 12; statPer.y--; } if (statPer.m > 12) { statPer.m = 1; statPer.y++; } } renderStats(); return; }
    const pr = e.target.closest('[data-per]'); if (pr) { statPer.year = pr.dataset.per === 'y'; renderStats(); }
  };
}

const pickOpt = { scope: '전체', dist: 0, tags: [] };
let lastPickId = null;
function openPick(){

async function doPick(){
  if (pickOpt.dist && !myPos) { toast('내 위치를 확인하는 중…'); await locate(false); if (!myPos) { $('#pickRes').innerHTML = `<div class="pickres">위치를 못 받아서 거리 조건을 쓸 수 없어요.<br><span class="small">"상관없음"으로 바꾸거나 위치 권한을 허용해 주세요.</span></div>`; return; } }
  let cand = cafes.filter(c => {
    if (pickOpt.scope === '다녀온 곳' && c.wish) return false;
    if (pickOpt.scope === '가보고 싶은 곳' && !c.wish) return false;
    if (pickOpt.scope === '또 갈래' && !c.fav) return false;
    if (pickOpt.tags.some(t => !(c.tags||[]).includes(t))) return false;
    if (pickOpt.dist && distKm(myPos, c) > pickOpt.dist) return false;
    return true;
  });
  if (!cand.length) { $('#pickRes').innerHTML = `<div class="pickres">조건에 맞는 곳이 없어요.<br><span class="small">거리를 넓히거나 태그를 줄여보세요.</span></div>`; return; }
  const total = cand.length;
  if (cand.length > 1 && lastPickId) cand = cand.filter(c => c.id !== lastPickId);
  const w = cand.map(c => 1 + cafeStats(c).rating + (c.fav ? 1.5 : 0) + (c.wish ? 1 : 0));
  let r = Math.random() * w.reduce((a,b) => a+b, 0), c = cand[0];
  for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) { c = cand[i]; break; } }
  lastPickId = c.id;
  const st = cafeStats(c);
  const ids = [c.coverPhotoId, ...st.photos].filter((v,i,a) => v && a.indexOf(v) === i).slice(0,3);
  const urls = await Promise.all(ids.map(i => getPhotoURL(i)));
  const d = myPos ? distKm(myPos, c) : null;
  const lv = st.lastVisit;
  $('#pickRes').innerHTML = `<div class="pickres">
    <div class="small" style="margin-bottom:8px">${total}곳 중에 골랐어요</div>
    ${ids.length ? polaroids(ids, urls) : '<div style="font-size:40px;margin:6px 0">☕</div>'}
    <div class="title" style="margin-top:6px">${c.wish ? '<span style="color:var(--sub)">☆</span> ' : ''}${esc(c.name)}</div>
    <div class="subt">${esc(shortAddr(c))}${d != null ? ' · ' + fmtDist(d) : ''}${st.rating ? ' · ★ ' + st.rating.toFixed(1) : ''}</div>
    <div style="margin-top:8px">${(c.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    ${lv && lv.review ? `<div class="note" style="margin-top:6px;text-align:left;background:var(--bg)">${esc(lv.review)}</div>` : ''}
    <div class="btnrow"><button class="btn" data-goto="${c.id}">지도에서 보기</button><button class="btn ghost" data-again="1">다시 뽑기</button></div>
    <div class="linkrow"><a class="btn kakao" href="https://map.kakao.com/link/to/${encodeURIComponent(c.name)},${c.lat},${c.lng}" target="_blank" rel="noopener">길찾기</a><a class="btn naver" href="${naverUrl(c)}" target="_blank" rel="noopener">네이버지도</a></div>
  </div>`;
  $('#pickRes').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function thumbData(id){
  try {
    const url = await getPhotoURL(id, 'thumb'); if (!url) return '';
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 260 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', .72);
  } catch { return ''; }
}

const pageStack = [];
let guard = false;
// 화면이 열려 있을 때만 브라우저 기록에 한 칸을 쌓아 두고, 폰의 뒤로가기로 닫히게 함.
// 앱이 스스로 history.back()을 부르지 않아서 사이트 밖으로 튕겨 나가지 않음.
function openPage(id){

}

  const i = pageStack.indexOf(id); if (i >= 0) pageStack.splice(i, 1);

window.addEventListener('popstate', () => {
  guard = false;
  if (!$('#viewer').classList.contains('hidden')) $('#viewer').classList.add('hidden');
  else if (pageStack.length) closePage(pageStack[pageStack.length - 1]);
  else if ($('#sheet').classList.contains('open')) closeSheet();
  if (pageStack.length) { history.pushState({m:1}, ''); guard = true; }
});
async function refreshAll(){
  await refreshPins();
  if (curTab === 'list') renderList();
  if (curTab === 'set') renderSettings();
  if (curTab === 'rec') renderRec();
}

/* =========================================================
   시작
   ========================================================= */
(async function start(){
  let th = 'coffee'; try { th = localStorage.getItem('theme') || 'coffee'; } catch {}
  applyTheme(th);
  if (SHARE_ID) { await startShareView(); return; }
  try { await DB.open(); await loadAll(); } catch { toast('이 브라우저에서는 저장이 안 돼요'); }
  await Sync.init();
  try { navigator.storage?.persist?.(); } catch {}
  await initMap();
  await refreshPins();
  renderSort();
  if (cafes.length && !localStorage.getItem('mapView')) fitAll();
  locate(false);
  if (session) Sync.run();
  else if (sb) {
    let seen = false; try { seen = !!localStorage.getItem('loginAsked'); } catch {}
    if (!seen) {
      try { localStorage.setItem('loginAsked', '1'); } catch {}
      if (await ask('카카오로 로그인하면 폰, PC 어디서든\n같은 기록과 사진을 볼 수 있어요.\n(나중에 설정 탭에서도 할 수 있어요)', '카카오로 로그인')) Sync.login();
    }
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
