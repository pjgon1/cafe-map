/* =========================================================
   화면 전환
   ========================================================= */
let curTab = 'map';
const tabHist = []; // 지나온 탭 (뒤로가기로 되돌아가기용)
function showTab(t, fromBack){
  if (!fromBack && t !== curTab) { tabHist.push(curTab); if (tabHist.length > 30) tabHist.shift(); armBack(); }
  curTab = t;
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['map','list','rec','fr','set'].forEach(k => $('#v-'+k).classList.toggle('hidden', k !== t));
  if (t === 'map' && map) { map.relayout(); }
  if (t === 'list') renderList();
  if (t === 'set') renderSettings();
  if (t === 'rec') renderRec();
  if (t === 'fr') loadFriendsTab();
}
$('#tabbar').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); };
const pageStack = [];
/* 폰 뒤로가기 버튼
   방법 1 (요즘 크롬·삼성인터넷): CloseWatcher — 폰 뒤로가기를 앱이 직접 받음. 기록을 안 쌓아서 꼬일 일이 없음
   방법 2 (옛 브라우저): 브라우저 기록에 칸을 쌓는 방식 (누른 직후에만 쌓을 수 있음)
   공통 순서: 확인창(취소) → 사진 크게 보기 → 열린 화면 → 카드(건물 목록) → 검색 → 바로 전에 보던 탭 → 종료 확인창 */
const useCW = typeof CloseWatcher === 'function';
let cw = null, tok = 0, skipPop = 0, exitAsk = false, exitedAt = 0;
const vis = el => !el.classList.contains('hidden');
function armCW(){
  if (!useCW || cw || exitAsk) return;
  try { cw = new CloseWatcher(); cw.onclose = () => { cw = null; backStep(); }; } catch { cw = null; }
}
function backStep(){
  if (exitAsk) return;
  if (closeTop()) setTimeout(armCW, 0); else askExit();
}
// 방법 2용: 열려 있는 것 하나당 기록 한 칸 + 바닥 한 칸
function wantTok(){
  return 1 + (vis($('#dlg')) && !exitAsk ? 1 : 0) + (vis($('#viewer')) ? 1 : 0) + pageStack.length
    + ($('#sheet').classList.contains('open') ? 1 + (bldChild ? 1 : 0) : 0) + (vis($('#results')) ? 1 : 0) + (SHARE_ID ? 0 : tabHist.length);
}
const canPush = () => !navigator.userActivation || navigator.userActivation.isActive;
function syncBack(){
  if (exitAsk) return;
  if (useCW) { armCW(); return; }
  const want = wantTok();
  if (want > tok) { if (!canPush()) return; while (tok < want) history.pushState({t: ++tok}, ''); }
  else if (want < tok && !skipPop) { skipPop++; history.go(want - tok); tok = want; }
}
const armBack = syncBack;
function openPage(id){
  $('#'+id).classList.add('open');
  if (!pageStack.includes(id)) pageStack.push(id);
  syncBack();
}
function closePage(id){
  $('#'+id).classList.remove('open');
  const i = pageStack.indexOf(id); if (i >= 0) pageStack.splice(i, 1);
}
const isOpen = id => $('#'+id).classList.contains('open');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closePage(b.dataset.close));
// 맨 위에 열린 것 하나 닫기. 닫을 게 없으면 false
function closeTop(){
  if (vis($('#dlg'))) { $('#dlgBtns [data-v="0"]')?.click(); return true; }
  if (vis($('#viewer'))) { $('#viewer').classList.add('hidden'); return true; }
  if (pageStack.length) { closePage(pageStack[pageStack.length - 1]); return true; }
  if ($('#sheet').classList.contains('open')) { if (bldChild && lastBld) showBuilding(lastBld); else closeSheet(); return true; }
  if (vis($('#results'))) { $('#qClear').click(); return true; }
  if (tabHist.length && !SHARE_ID) { showTab(tabHist.pop(), true); return true; }
  return false;
}
function askExit(){
  exitAsk = true;
  if (cw) { try { cw.destroy(); } catch {} cw = null; }
  if (tok > 0) { skipPop++; history.go(-tok); tok = 0; } // 남은 기록 칸 정리 → 다음 뒤로가기에 바로 꺼지게
  $('#dlgMsg').textContent = '커피로그를 종료할까요?';
  $('#dlgBtns').innerHTML = '<button class="btn ghost" data-v="0">취소</button><button class="btn" data-v="1">종료</button>';
  $('#dlg').classList.remove('hidden');
  $('#dlgBtns').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v === '1') {
      try { window.close(); } catch {}
      // 폰이 앱을 못 닫게 막으면: 창은 그대로 두고 안내만 (이때 뒤로가기 한 번이면 꺼짐)
      setTimeout(() => { if (!document.hidden) $('#dlgMsg').textContent = '폰이 앱을 바로 못 닫게 막고 있어요.\n뒤로가기를 한 번 누르면 꺼져요.'; }, 400);
      return;
    }
    $('#dlg').classList.add('hidden'); exitAsk = false; syncBack();
  };
}
window.addEventListener('popstate', e => {
  if (useCW) return;
  const now = e.state?.t || 0;
  if (skipPop) { skipPop--; tok = now; return; } // 앱이 스스로 되감은 것
  let steps = Math.max(1, tok - now); tok = now;
  if (exitAsk) return;
  while (steps-- > 0) if (!closeTop()) break;
  if (tok === 0) askExit();
});
// 누른 직후마다 맞추기 (+ 앱이 알아서 연 것도 잠깐 뒤 맞춤)
for (const ev of ['click', 'touchend', 'keydown']) document.addEventListener(ev, () => setTimeout(syncBack, 0), true);
setInterval(syncBack, 400);
armCW(); // 앱을 켜자마자 뒤로가기를 눌러도 종료 확인창이 뜨게
// 종료 확인창이 뜬 상태에서 앱을 나갔다면, 다시 들어올 때 처음 화면부터 새로 시작
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (exitAsk) exitedAt = Date.now(); return; }
  if (exitedAt) { const q = new URLSearchParams(location.search); q.delete('u'); location.replace(location.pathname + (q.toString() ? '?' + q : '')); }
});
let lastCupDay = cupDay();
setInterval(() => { if (cupDay() !== lastCupDay && !SHARE_ID) { lastCupDay = cupDay(); refreshAll(); } }, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cupDay() !== lastCupDay && !SHARE_ID) { lastCupDay = cupDay(); refreshAll(); } });
async function refreshAll(){
  await refreshPins();
  if (curTab === 'list') renderList();
  if (curTab === 'set') renderSettings();
  if (curTab === 'rec') renderRec();
  checkStamps();
  if (conq.on) drawConquest();
}

/* =========================================================
   앱 업데이트 (홈 화면에 깔린 앱이 옛 화면을 붙잡고 있을 때)
   ========================================================= */
const APP_VERSION = '2026.11.19-18'; // 고칠 때마다 올림
async function latestVersion(){
  try { const t = await (await fetch('index.html?v=' + Date.now(), { cache: 'no-store' })).text(); return (t.match(/const APP_VERSION = '([^']+)'/) || [])[1] || ''; }
  catch { return ''; }
}
async function applyUpdate(){
  loading(true, '최신 버전 받는 중…');
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  location.replace(location.pathname + '?u=' + Date.now());
}
$('#btnUpdate').onclick = async () => {
  loading(true, '새 버전 확인 중…'); const v = await latestVersion(); loading(false);
  if (!v) { toast('인터넷 연결을 확인해 주세요'); return; }
  if (v !== APP_VERSION) { toast(`새 버전 ${v}으로 바꿔요`); applyUpdate(); return; }
  if (await ask(`이미 최신 버전이에요 (${APP_VERSION}).\n그래도 새로 받아올까요?`, '새로 받기')) applyUpdate();
};
// 앱을 열거나 다시 볼 때 새 버전이 있으면 물어봄 (30분에 한 번만 확인)
let verCheckedAt = 0;
async function autoCheckUpdate(){
  if (SHARE_ID || Date.now() - verCheckedAt < 30 * 60 * 1000) return;
  verCheckedAt = Date.now();
  const v = await latestVersion(); if (!v || v === APP_VERSION) return;
  let skipped = ''; try { skipped = sessionStorage.getItem('skipVer') || ''; } catch {}
  if (skipped === v || pageStack.length || !$('#dlg').classList.contains('hidden') || !$('#loading').classList.contains('hidden')) return;
  if (await ask(`새 버전이 나왔어요 (${v}).\n지금 업데이트할까요? 기록은 그대로예요.`, '업데이트')) applyUpdate();
  else { try { sessionStorage.setItem('skipVer', v); } catch {} }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoCheckUpdate(); });

/* =========================================================
   시작
   ========================================================= */
async function start(){
  // 업데이트하느라 붙인 주소 꼬리(?u=) 정리
  if (/[?&]u=/.test(location.search)) { const q = new URLSearchParams(location.search); q.delete('u'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
  try { $('#verInfo').textContent = '지금 버전 ' + APP_VERSION; } catch {}
  let th = 'coffee'; try { th = localStorage.getItem('theme') || 'coffee'; } catch {}
  applyTheme(th);
  if (SHARE_ID) { await startShareView(); return; }
  try { await DB.open(); await loadAll(); } catch { toast('이 브라우저에서는 저장이 안 돼요'); }
  await Sync.init();
  try { navigator.storage?.persist?.(); } catch {}
  await initMap();
  await refreshPins();
  renderSort();
  if (cafes.length && !localStorage.getItem('mapView')) fitAll();
  locate(false);
  if (session) Sync.run();
  else if (sb) {
    let seen = false; try { seen = !!localStorage.getItem('loginAsked'); } catch {}
    if (!seen) {
      try { localStorage.setItem('loginAsked', '1'); } catch {}
      if (await ask('로그인하면 폰, PC 어디서든\n같은 기록과 사진을 볼 수 있어요.\n(나중에 설정 탭에서도 할 수 있어요)', '로그인')) openLogin();
    }
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(autoCheckUpdate, 4000);
}
// 지도·로그인 스크립트는 화면을 먼저 띄운 뒤 받아옴 (defer). 다 받아지면 시작
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
</script>
